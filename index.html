<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jump!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(160deg, #1a0030 0%, #0a0a2e 40%, #1a0010 100%);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100vh; overflow: hidden;
  font-family: Arial, sans-serif; color: #fff;
}
h1 {
  font-size: 2rem; letter-spacing: 4px;
  background: linear-gradient(90deg, #ff4466, #4488ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px; text-shadow: none;
}
#ui { display: flex; gap: 40px; margin-bottom: 8px; font-size: .95rem; }
.ui-box { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 4px 16px; }
.ui-label { color: #aaa; font-size: .72rem; text-align: center; }
.ui-val { font-size: 1.1rem; font-weight: bold; text-align: center; }
#score-val { color: #f0e040; }
#lives-val { color: #ff4466; }
#level-val { color: #4af; }
canvas {
  border: 2px solid rgba(255,255,255,.12);
  border-radius: 10px;
  display: block;
}
#controls { margin-top: 8px; color: rgba(255,255,255,.4); font-size: .75rem; }
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10;
}
#overlay h2 { font-size: 2.5rem; margin-bottom: 8px; }
#overlay p  { color: #aaa; margin-bottom: 22px; font-size: 1rem; }
#overlay button {
  padding: 12px 36px; border-radius: 10px; border: none;
  font-size: 1rem; font-weight: bold; cursor: pointer;
  background: linear-gradient(135deg, #ff4466, #4488ff);
  color: #fff; transition: filter .15s;
}
#overlay button:hover { filter: brightness(1.2); }
</style>
</head>
<body>
<h1>⬛ JUMP ⬛</h1>
<div id="ui">
  <div class="ui-box"><div class="ui-label">PUNKTE</div><div class="ui-val" id="score-val">0</div></div>
  <div class="ui-box"><div class="ui-label">LEBEN</div><div class="ui-val" id="lives-val">❤️❤️❤️</div></div>
  <div class="ui-box"><div class="ui-label">LEVEL</div><div class="ui-val" id="level-val">1</div></div>
</div>
<canvas id="canvas" width="800" height="420"></canvas>
<div id="controls">← → Bewegen &nbsp;|&nbsp; LEERTASTE / ↑ Springen &nbsp;|&nbsp; Doppelsprung möglich</div>

<div id="overlay">
  <h2 id="ov-title">⬛ JUMP ⬛</h2>
  <p id="ov-sub">Springe über Spikes und sammle Punkte!</p>
  <button id="ov-btn" onclick="startGame()">Spielen</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = 800, H = 420;
const GRAVITY = 0.55;
const JUMP_FORCE = -13;
const PLAYER_SPEED = 4.5;

let state, animId;

// ===== LEVEL TEMPLATES =====
// Each level: array of platform configs + spike configs
// Platform: {x, y, w}  (screen-relative, camera-independent for floor)
// Spikes generated procedurally per level

function initState() {
  state = {
    score: 0,
    lives: 3,
    level: 1,
    dead: false,
    won: false,
    cameraX: 0,
    levelLength: 3200,
    player: {
      x: 100, y: 300,
      vx: 0, vy: 0,
      w: 22, h: 38,
      onGround: false,
      jumpsLeft: 2,
      facing: 1,
      runFrame: 0,
      runTimer: 0,
      invincible: 0,
    },
    platforms: [],
    spikes: [],
    coins: [],
    particles: [],
    flags: [],
  };
  buildLevel(state.level);
}

function buildLevel(lvl) {
  state.platforms = [];
  state.spikes = [];
  state.coins = [];
  state.flags = [];

  const len = 2400 + lvl * 400;
  state.levelLength = len;

  // Floor segments (with gaps on higher levels)
  const floorY = H - 60;
  let x = 0;
  while (x < len + 200) {
    const gapChance = lvl >= 3 ? 0.25 : lvl === 2 ? 0.12 : 0.05;
    const segW = 180 + Math.random() * 220;
    if (x > 400 && Math.random() < gapChance) {
      x += 60 + Math.random() * 80; // gap
    } else {
      state.platforms.push({ x, y: floorY, w: segW, isFloor: true });
      x += segW;
    }
  }

  // Floating platforms
  const floatCount = 8 + lvl * 4;
  for (let i = 0; i < floatCount; i++) {
    const px = 300 + Math.random() * (len - 500);
    const py = floorY - 80 - Math.random() * 160;
    const pw = 80 + Math.random() * 100;
    state.platforms.push({ x: px, y: py, w: pw, isFloor: false });
  }

  // Spikes on floor platforms
  state.platforms.forEach(p => {
    if (!p.isFloor) return;
    const density = 0.04 + lvl * 0.025;
    let sx = p.x + 20;
    while (sx < p.x + p.w - 20) {
      if (Math.random() < density) {
        state.spikes.push({ x: sx, y: p.y, onPlatform: p });
        sx += 40 + Math.random() * 60;
      } else {
        sx += 30 + Math.random() * 40;
      }
    }
  });

  // Coins above platforms
  state.platforms.forEach(p => {
    const count = Math.floor(p.w / 80);
    for (let i = 0; i < count; i++) {
      const cx = p.x + 30 + Math.random() * (p.w - 60);
      state.coins.push({ x: cx, y: p.y - 35, collected: false, anim: Math.random() * Math.PI * 2 });
    }
  });

  // Goal flag at end
  const lastFloor = state.platforms.filter(p => p.isFloor).sort((a,b) => b.x - a.x)[0];
  if (lastFloor) {
    state.flags.push({ x: lastFloor.x + lastFloor.w - 60, y: lastFloor.y - 60, reached: false });
  }
}

// ===== UPDATE =====
function update() {
  if (state.dead || state.won) return;
  const p = state.player;
  state.score += 1;

  // Movement
  p.vx = 0;
  if (keys.ArrowLeft || keys.a)  { p.vx = -PLAYER_SPEED; p.facing = -1; }
  if (keys.ArrowRight || keys.d) { p.vx =  PLAYER_SPEED; p.facing =  1; }

  // Run animation
  if (p.vx !== 0 && p.onGround) {
    p.runTimer++;
    if (p.runTimer > 8) { p.runFrame = (p.runFrame + 1) % 4; p.runTimer = 0; }
  } else if (p.vx === 0) { p.runFrame = 0; }

  p.vy += GRAVITY;
  p.x += p.vx;
  p.y += p.vy;
  p.onGround = false;
  if (p.invincible > 0) p.invincible--;

  // Platform collision
  for (const pl of state.platforms) {
    if (p.x + p.w > pl.x && p.x < pl.x + pl.w) {
      // Landing on top
      if (p.vy >= 0 && p.y + p.h > pl.y && p.y + p.h < pl.y + 20) {
        p.y = pl.y - p.h;
        p.vy = 0;
        p.onGround = true;
        p.jumpsLeft = 2;
      }
      // Hitting bottom (only floor platforms)
      if (pl.isFloor && p.vy < 0 && p.y > pl.y && p.y < pl.y + 20) {
        p.vy = 0;
        p.y = pl.y + 20;
      }
    }
  }

  // Camera
  state.cameraX = Math.max(0, p.x - W * 0.35);

  // Spike collision
  if (p.invincible === 0) {
    for (const sp of state.spikes) {
      const sx = sp.x, sy = sp.y - 20;
      if (p.x + p.w - 4 > sx && p.x + 4 < sx + 18 && p.y + p.h > sy && p.y < sp.y) {
        die();
        return;
      }
    }
  }

  // Fall off screen
  if (p.y > H + 100) { die(); return; }

  // Collect coins
  for (const c of state.coins) {
    if (c.collected) continue;
    if (Math.abs(p.x + p.w/2 - c.x) < 22 && Math.abs(p.y + p.h/2 - c.y) < 22) {
      c.collected = true;
      state.score += 50;
      burst(c.x, c.y, '#f0e040', 6);
    }
    c.anim += 0.06;
  }

  // Goal flag
  for (const f of state.flags) {
    if (!f.reached && p.x + p.w > f.x && p.x < f.x + 30 && p.y < f.y + 60 && p.y + p.h > f.y) {
      f.reached = true;
      state.score += 500 + state.level * 100;
      setTimeout(() => nextLevel(), 800);
    }
  }

  // Particles
  for (const pt of state.particles) {
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15;
    pt.life--;
  }
  state.particles = state.particles.filter(pt => pt.life > 0);
}

function die() {
  state.lives--;
  burst(state.player.x + 11, state.player.y + 19, '#ff4466', 14);
  if (state.lives <= 0) {
    state.dead = true;
    setTimeout(() => showOverlay('💀 GAME OVER', `Punkte: ${state.score}`, 'Nochmal'), 600);
  } else {
    // Respawn
    state.player.x = 100; state.player.y = 200;
    state.player.vx = 0; state.player.vy = 0;
    state.player.invincible = 120;
    state.cameraX = 0;
    updateUI();
  }
}

function nextLevel() {
  if (state.level >= 5) {
    state.won = true;
    showOverlay('🏆 GEWONNEN!', `Alle Level geschafft! Punkte: ${state.score}`, 'Nochmal spielen');
    return;
  }
  state.level++;
  state.player.x = 100; state.player.y = 200;
  state.player.vx = 0; state.player.vy = 0;
  state.player.invincible = 60;
  state.cameraX = 0;
  buildLevel(state.level);
  updateUI();
}

function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    state.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 25 + Math.random()*15, color, size: 2 + Math.random()*3 });
  }
}

// ===== DRAW =====
function drawBg() {
  // Sky gradient – red-blue split
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0,    '#1a0040');
  grad.addColorStop(0.45, '#0a0a35');
  grad.addColorStop(0.55, '#1a0020');
  grad.addColorStop(1,    '#2a0010');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars / floating dots
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + state.cameraX * 0.15) % W + W) % W;
    const sy = (i * 73) % (H * 0.75);
    ctx.beginPath(); ctx.arc(sx, sy, .8, 0, Math.PI*2); ctx.fill();
  }

  // Parallax back mountains
  const camP = state.cameraX * 0.3;
  ctx.fillStyle = 'rgba(80,0,120,.35)';
  for (let i = 0; i < 6; i++) {
    const mx = ((i * 200 - camP) % (W + 200) + (W + 200)) % (W + 200) - 100;
    const mh = 80 + (i % 3) * 60;
    ctx.beginPath(); ctx.moveTo(mx - 80, H); ctx.lineTo(mx, H - mh); ctx.lineTo(mx + 80, H); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,40,140,.35)';
  for (let i = 0; i < 5; i++) {
    const mx = ((i * 240 + 120 - camP * 0.6) % (W + 200) + (W + 200)) % (W + 200) - 100;
    const mh = 60 + (i % 2) * 80;
    ctx.beginPath(); ctx.moveTo(mx - 70, H); ctx.lineTo(mx, H - mh); ctx.lineTo(mx + 70, H); ctx.closePath(); ctx.fill();
  }
}

function drawPlatform(p) {
  const x = p.x - state.cameraX, y = p.y, w = p.w;
  if (x + w < -20 || x > W + 20) return;

  if (p.isFloor) {
    // Floor block
    const g = ctx.createLinearGradient(x, y, x, y + 60);
    g.addColorStop(0, '#5a3a8a');
    g.addColorStop(0.15, '#3a2060');
    g.addColorStop(1, '#1a0a30');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, H - y + 10);
    // Top edge line – red/blue glow
    ctx.strokeStyle = state.level % 2 === 0 ? '#4488ff' : '#ff4466';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
    // Grid texture
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1;
    for (let tx = Math.floor(x / 40) * 40; tx < x + w; tx += 40) {
      ctx.beginPath(); ctx.moveTo(tx, y); ctx.lineTo(tx, H); ctx.stroke();
    }
  } else {
    // Floating platform
    const g = ctx.createLinearGradient(x, y, x, y + 18);
    g.addColorStop(0, '#7755cc');
    g.addColorStop(1, '#2a1060');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x, y, w, 16, 4); ctx.fill();
    ctx.strokeStyle = state.level % 2 === 0 ? '#66aaff' : '#ff6688';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 1); ctx.lineTo(x + w - 4, y + 1); ctx.stroke();
    // Bottom glow
    ctx.shadowColor = state.level % 2 === 0 ? '#4488ff' : '#ff4466';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = ctx.shadowColor;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 15); ctx.lineTo(x + w - 4, y + 15); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawSpike(sp) {
  const x = sp.x - state.cameraX;
  if (x < -20 || x > W + 20) return;
  const y = sp.y;
  // Triangle spike
  const grad = ctx.createLinearGradient(x + 9, y - 22, x + 9, y);
  grad.addColorStop(0, '#ff2244');
  grad.addColorStop(1, '#880011');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 9, y - 22); ctx.lineTo(x + 18, y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ff88aa';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Glow
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(x + 9, y - 22); ctx.lineTo(x + 9, y - 8); ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawCoin(c) {
  if (c.collected) return;
  const x = c.x - state.cameraX, y = c.y + Math.sin(c.anim) * 5;
  if (x < -20 || x > W + 20) return;
  const g = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, 10);
  g.addColorStop(0, '#fff9aa'); g.addColorStop(1, '#f0c000');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#cc9900'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#cc9900'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', x, y);
}

function drawFlag(f) {
  const x = f.x - state.cameraX, y = f.y;
  if (x < -20 || x > W + 20) return;
  // Pole
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 3, y + 60); ctx.lineTo(x + 3, y); ctx.stroke();
  // Flag
  const waving = Math.sin(Date.now() * 0.005) * 5;
  ctx.fillStyle = f.reached ? '#f0e040' : '#44ff88';
  ctx.beginPath();
  ctx.moveTo(x + 3, y);
  ctx.lineTo(x + 28 + waving, y + 10);
  ctx.lineTo(x + 3, y + 20);
  ctx.closePath(); ctx.fill();
}

function drawPlayer() {
  const p = state.player;
  const x = p.x - state.cameraX, y = p.y;
  if (p.invincible > 0 && Math.floor(p.invincible / 6) % 2 === 0) return;

  ctx.save();
  ctx.translate(x + p.w / 2, y + p.h);
  if (p.facing < 0) ctx.scale(-1, 1);

  const run = p.runFrame;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 2, 12, 4, 0, 0, Math.PI*2); ctx.fill();

  // Legs
  const legOffset = p.onGround ? [Math.sin(run * Math.PI / 2) * 6, -Math.sin(run * Math.PI / 2) * 6] : [4, -4];
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(-9 + legOffset[0], -20, 8, 18);
  ctx.fillRect(1 + legOffset[1], -20, 8, 18);

  // Body
  const bodyGrad = ctx.createLinearGradient(-10, -38, 10, -20);
  bodyGrad.addColorStop(0, '#e05555');
  bodyGrad.addColorStop(1, '#aa2222');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.roundRect(-10, -38, 20, 20, 3); ctx.fill();

  // Arms
  const armSwing = p.onGround ? Math.sin(run * Math.PI / 2) * 12 : -20;
  ctx.fillStyle = '#cc3333';
  ctx.save(); ctx.translate(-10, -34); ctx.rotate((armSwing * Math.PI) / 180);
  ctx.fillRect(-3, 0, 6, 14); ctx.restore();
  ctx.save(); ctx.translate(10, -34); ctx.rotate((-armSwing * Math.PI) / 180);
  ctx.fillRect(-3, 0, 6, 14); ctx.restore();

  // Head
  const headGrad = ctx.createRadialGradient(-3, -46, 2, 0, -44, 12);
  headGrad.addColorStop(0, '#ffccaa'); headGrad.addColorStop(1, '#e8a070');
  ctx.fillStyle = headGrad;
  ctx.beginPath(); ctx.arc(0, -44, 12, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(4, -45, 4, 5, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(5, -44, 2, 3, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -46, 1, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = '#331100';
  ctx.beginPath(); ctx.ellipse(0, -54, 11, 7, 0, 0, Math.PI*2); ctx.fill();

  // Jump dust
  if (!p.onGround) {
    ctx.fillStyle = 'rgba(150,100,255,.25)';
    ctx.beginPath(); ctx.ellipse(0, 2, 14, 5, 0, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawParticles() {
  for (const p of state.particles) {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - state.cameraX, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Progress bar
  const prog = Math.min(state.player.x / state.levelLength, 1);
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.roundRect(W/2 - 120, 12, 240, 10, 5); ctx.fill();
  const barGrad = ctx.createLinearGradient(W/2 - 120, 0, W/2 + 120, 0);
  barGrad.addColorStop(0, '#4488ff'); barGrad.addColorStop(1, '#ff4466');
  ctx.fillStyle = barGrad;
  ctx.beginPath(); ctx.roundRect(W/2 - 120, 12, 240 * prog, 10, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '9px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ZIEL', W/2 + 112, 17);
}

function render() {
  drawBg();
  state.platforms.forEach(drawPlatform);
  state.coins.forEach(drawCoin);
  state.flags.forEach(drawFlag);
  state.spikes.forEach(drawSpike);
  drawPlayer();
  drawParticles();
  drawHUD();
}

// ===== MAIN LOOP =====
function loop() {
  update();
  render();
  updateUI();
  animId = requestAnimationFrame(loop);
}

function updateUI() {
  document.getElementById('score-val').textContent = state.score;
  document.getElementById('level-val').textContent = state.level + ' / 5';
  const hearts = '❤️'.repeat(state.lives) + '🖤'.repeat(Math.max(0, 3 - state.lives));
  document.getElementById('lives-val').textContent = hearts;
}

// ===== INPUT =====
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true; keys[e.key] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') && state.player) {
    e.preventDefault();
    if (state.player.jumpsLeft > 0) {
      state.player.vy = JUMP_FORCE - (state.player.jumpsLeft === 1 ? 1.5 : 0);
      state.player.jumpsLeft--;
      burst(state.player.x + 11, state.player.y + state.player.h, '#aaaaff', 5);
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; keys[e.key] = false; });

// ===== OVERLAY =====
function showOverlay(title, sub, btn) {
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-sub').textContent = sub;
  document.getElementById('ov-btn').textContent = btn;
  document.getElementById('overlay').style.display = 'flex';
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  if (animId) cancelAnimationFrame(animId);
  initState();
  updateUI();
  loop();
}
</script>
</body>
</html>
