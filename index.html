<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloon Pop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;font-family:Arial,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;}
#map-select{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;z-index:200;overflow-y:auto;padding-bottom:20px;}
#map-select h1{font-size:2rem;color:#f0e040;text-shadow:0 0 20px #f0a000,2px 2px 0 #a06000;padding:14px 0 4px;letter-spacing:3px;}
#map-select p{color:#aaa;margin-bottom:14px;font-size:.88rem;}
#map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;width:100%;padding:0 14px;}
.map-card{background:#16213e;border:2px solid #0f3460;border-radius:10px;cursor:pointer;transition:all .18s;overflow:hidden;}
.map-card:hover{border-color:#f0a000;box-shadow:0 0 14px #f0a00055;transform:translateY(-2px);}
.map-card canvas{display:block;width:100%;}
.map-card-info{padding:8px 10px;}
.map-card-name{font-size:.88rem;font-weight:bold;color:#f0e040;}
.map-card-diff{font-size:.72rem;color:#aaa;margin-top:2px;}
.diff-easy{color:#27ae60;}.diff-med{color:#f39c12;}.diff-hard{color:#e74c3c;}.diff-expert{color:#9b59b6;}.diff-extreme{color:#ff00ff;}
#game-wrapper{display:none;flex-direction:column;align-items:center;}
#title{font-size:1.7rem;font-weight:bold;color:#f0e040;text-shadow:0 0 20px #f0a000,2px 2px 0 #a06000;padding:5px 0 2px;letter-spacing:3px;}
#game-area{display:flex;gap:10px;align-items:flex-start;padding:3px 8px;}
#canvas{border:3px solid #f0a000;border-radius:6px;cursor:crosshair;display:block;}
#sidebar{width:195px;display:flex;flex-direction:column;gap:5px;max-height:535px;overflow-y:auto;}
#sidebar::-webkit-scrollbar{width:4px;}
#sidebar::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px;}
#stats{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:7px 9px;font-size:.8rem;}
.stat-row{display:flex;justify-content:space-between;margin-bottom:3px;}
.stat-label{color:#aaa;}.stat-val{font-weight:bold;color:#f0e040;}
#towers-panel{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:7px;}
#towers-panel h3{font-size:.75rem;color:#aaa;margin-bottom:5px;text-align:center;text-transform:uppercase;letter-spacing:1px;}
.tower-btn{width:100%;margin-bottom:3px;padding:4px;border-radius:5px;border:2px solid transparent;cursor:pointer;font-size:.72rem;font-weight:bold;transition:all .15s;display:flex;align-items:center;gap:5px;background:#0f3460;color:#fff;}
.tower-btn:hover{filter:brightness(1.2);}.tower-btn.selected{border-color:#f0e040;box-shadow:0 0 7px #f0a000;}.tower-btn.too-expensive{opacity:.4;cursor:not-allowed;}
.tower-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.tower-name{font-size:.72rem;}.tower-cost{font-size:.65rem;color:#f0e040;}
#upgrade-panel{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:7px;display:none;}
#upgrade-panel h3{font-size:.75rem;color:#aaa;margin-bottom:5px;text-align:center;}
.upgrade-path{margin-bottom:6px;background:#0a1a30;border-radius:5px;padding:4px;}
.path-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;font-size:.68rem;color:#aaa;}
.path-name{font-weight:bold;}.path-pips{display:flex;gap:2px;}
.pip{width:8px;height:8px;border-radius:50%;background:#333;border:1px solid #555;}
.pip.filled{background:#f0e040;border-color:#f0a000;box-shadow:0 0 3px #f0a000;}
.pip.filled.t3{background:#e74c3c;border-color:#c00;}.pip.filled.t4{background:#9b59b6;border-color:#7d3c98;}.pip.filled.t5{background:#f39c12;box-shadow:0 0 5px #f39c12;}
.upgrade-tier-btn{width:100%;padding:3px 5px;border-radius:4px;border:none;cursor:pointer;font-size:.64rem;font-weight:bold;background:#0f5460;color:#fff;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;transition:all .15s;}
.upgrade-tier-btn:hover:not(:disabled){filter:brightness(1.25);}.upgrade-tier-btn:disabled{opacity:.35;cursor:not-allowed;}
.upgrade-tier-btn.done{background:#1a3a20;border-left:3px solid #27ae60;}.upgrade-tier-btn.t3{background:#3a1a0a;border-left:3px solid #e74c3c;}.upgrade-tier-btn.t4{background:#2a1040;border-left:3px solid #9b59b6;}.upgrade-tier-btn.t5{background:#3a2000;border-left:3px solid #f39c12;}
.tier-cost{color:#f0e040;font-size:.62rem;}
#sell-btn{width:100%;padding:4px;border-radius:5px;border:none;cursor:pointer;font-size:.7rem;font-weight:bold;background:#7a0000;color:#fff;margin-top:3px;}
#sell-btn:hover{filter:brightness(1.2);}
#action-btns{display:flex;flex-direction:column;gap:4px;}
#start-btn,#speed-btn,#back-btn{padding:7px;border-radius:7px;border:none;cursor:pointer;font-size:.82rem;font-weight:bold;width:100%;transition:all .15s;}
#start-btn{background:#16a34a;color:#fff;}#start-btn:hover:not(:disabled){filter:brightness(1.15);}#start-btn:disabled{background:#444;cursor:not-allowed;}
#speed-btn{background:#1d4ed8;color:#fff;}#speed-btn:hover{filter:brightness(1.15);}
#back-btn{background:#2c3e50;color:#fff;}#back-btn:hover{filter:brightness(1.2);}
#bloon-legend{background:#16213e;border:2px solid #0f3460;border-radius:8px;padding:5px;font-size:.65rem;}
#bloon-legend h3{color:#aaa;margin-bottom:4px;text-align:center;font-size:.68rem;text-transform:uppercase;}
.legend-row{display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.legend-circle{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.3);}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.93);border:3px solid #f0a000;border-radius:16px;padding:26px 42px;text-align:center;display:none;z-index:300;}
#message h2{font-size:1.8rem;margin-bottom:8px;}
#message p{color:#aaa;margin-bottom:16px;}
.msg-btns{display:flex;gap:10px;justify-content:center;}
.msg-btns button{padding:10px 22px;border-radius:7px;border:none;cursor:pointer;font-size:.9rem;font-weight:bold;}
#msg-restart{background:#16a34a;color:#fff;}#msg-menu{background:#2c3e50;color:#fff;}
</style>
</head>
<body>
<div id="map-select">
  <h1>🎈 BLOON POP 🎈</h1>
  <p>Wähle deine Karte</p>
  <div id="map-grid"></div>
</div>
<div id="game-wrapper">
  <div id="title">🎈 BLOON POP 🎈</div>

      <div id="action-btns">

        <button id="speed-btn">⏩ 2x Speed</button>
        <button id="back-btn">🗺 Karte wechseln</button>

        <div class="legend-row"><div class="legend-circle" style="background:#e74c3c"></div><span>Rot (1 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#3498db"></div><span>Blau (2 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#27ae60"></div><span>Grün (3 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#f39c12"></div><span>Gelb (4 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#ff69b4"></div><span>Pink (5 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#888"></div><span>Schwarz (6 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#8B4513"></div><span>Keramik (10 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#d4af37;border:2px solid #8B0000"></div><span>MOAB (200 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#4444ff;border:2px solid #0000aa"></div><span>BFB (700 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#00cc00;border:2px solid #006600"></div><span>ZOMG (4000 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#111;border:2px solid #666"></div><span>DDT (375 HP schnell)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#ff0055;border:2px solid #aa0033"></div><span>BAD (20000 HP)</span></div>
      </div>
    </div>
  </div>
</div>
<div id="message">
  <h2 id="msg-title"></h2><p id="msg-sub"></p>
  <div class="msg-btns">
    <button id="msg-restart" onclick="restartGame()">Nochmal</button>
    <button id="msg-menu" onclick="goToMenu()">Karte wählen</button>
  </div>
</div>

// ===== WAVES (60 Runden) =====
function makeWave(round){
  const b=[],r=round;
  function add(type,count,iv=20,off=0){for(let i=0;i<count;i++)b.push({type,delay:off+i*iv});}
  if(r<=2)         {add('red',8+r*4);}
  else if(r<=4)    {add('red',10+r*2);add('blue',r*3,25,20);}
  else if(r<=7)    {add('blue',r*5,20);add('green',r*2,32,30);}
  else if(r<=10)   {add('green',r*3,22);add('yellow',r*2,32,40);}
  else if(r<=13)   {add('yellow',r*3,20);add('pink',r*2,28,50);}
  else if(r<=16)   {add('pink',r*3,18);add('black',r,35);}
  else if(r<=20)   {add('black',r*2,20);add('pink',r,24,10);}
  else if(r<=25)   {add('ceramic',Math.ceil(r*1.5),26);add('black',r,22,20);}
  else if(r<=28)   {add('ceramic',r*2,20);add('moab',Math.floor(r/7),90);}
  else if(r<=32)   {add('moab',Math.floor(r/4),80);add('ceramic',r,22,10);}
  else if(r<=36)   {add('moab',Math.floor(r/3),70);add('bfb',1,200);add('ceramic',r,18,10);}
  else if(r<=40)   {add('bfb',Math.floor(r/8),150);add('moab',r/4|0,60);add('ceramic',r,14,20);}
  else if(r<=44)   {add('bfb',Math.floor(r/6),120);add('zomg',1,300);add('moab',r/5|0,55);}
  else if(r<=48)   {add('zomg',1,300);add('ddt',Math.floor(r/8),80);add('bfb',r/8|0,120);}
  else if(r<=52)   {add('zomg',2,250);add('ddt',Math.floor(r/6),70);add('bfb',r/6|0,100);}
  else if(r<=56)   {add('bad',1,500);add('zomg',2,200);add('ddt',r/4|0,60);}
  else if(r<=58)   {add('bad',2,400);add('zomg',3,180);add('ddt',r/3|0,55);}
  else             {add('bad',3,350);add('zomg',4,160);add('ddt',15,50);add('bfb',8,100,20);}
  b.sort((a,z)=>a.delay-z.delay);
  return b;
}

// ===== PATH HELPERS =====
function getPath(){return currentMap.path;}
function posOnPath(dist){
  const P=getPath();let rem=dist;
  for(let i=1;i<P.length;i++){
    const dx=P[i].x-P[i-1].x,dy=P[i].y-P[i-1].y,seg=Math.sqrt(dx*dx+dy*dy);
    if(rem<=seg){const t=rem/seg;return{x:P[i-1].x+dx*t,y:P[i-1].y+dy*t,done:false};}
    rem-=seg;
  }
  return{x:P[P.length-1].x,y:P[P.length-1].y,done:true};
}
function isOnPath(x,y,m=20){
  const P=getPath();
  for(let i=1;i<P.length;i++){
    const ax=P[i-1].x,ay=P[i-1].y,bx=P[i].x,by=P[i].y,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/l2));
    if(Math.sqrt((x-ax-t*dx)**2+(y-ay-t*dy)**2)<m)return true;
  }
  return false;
}

// ===== UPGRADE SYSTEM =====
function canUpgradePath(t,path){
  const lv=t.upgrades;
  if(lv[path]>=5)return false;
  const next=lv[path]+1;
  if(lv[path]===0&&lv.filter(l=>l>0).length>=2)return false;
  if(next>=3&&lv.some((l,i)=>i!==path&&l>=3))return false;
  if(lv.some((l,i)=>i!==path&&l>=3)&&next>2)return false;
  return true;
}
function applyUpgrade(tower,path){
  const def=TOWER_DEFS.find(d=>d.id===tower.typeId);
  def.upgrades[path][tower.upgrades[path]].apply(tower);
  tower.upgrades[path]++;
}
function upgradeCost(tower,path){
  const def=TOWER_DEFS.find(d=>d.id===tower.typeId);
  return tower.upgrades[path]>=5?Infinity:def.upgrades[path][tower.upgrades[path]].cost;
}

    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,maxLife:50,color,size:2+Math.random()*3});}

// ===== DAMAGE =====
function takeDamage(b,dmg){
  if(!b||b.dead)return;
  b.hp-=dmg;if(b.hp<=0)killBloon(b);
}
function killBloon(b){
  const bt=BLOON_TYPES[b.type];
  state.money+=bt.reward;state.popped++;
  burst(b.x,b.y,bt.color,bt.isMoabClass?20:8);
  b.dead=true;
  // Spawn children
  const children={moab:['ceramic','ceramic','ceramic','ceramic'],
    bfb:['moab','moab','moab','moab'],
    zomg:['bfb','bfb','bfb','bfb'],
    ddt:['ceramic','ceramic','black','black'],
    bad:['zomg','zomg','ddt','ddt','ddt']};
  if(children[b.type]){
    children[b.type].forEach(child=>{
      const c=spawnBloon(child);c.dist=b.dist;
      const p=posOnPath(c.dist);c.x=p.x;c.y=p.y;
      state.bloons.push(c);
    });
  }
  updateUI();
}

// ===== TOWER AI =====
function findTarget(tower){
  if(tower.isFarm||tower.isVillage||tower.isSpikeFactory)return null;
  let best=null,bestDist=-1;
  for(const b of state.bloons){
    if(b.dead)continue;
    if(b.frozenTimer>0&&!tower.isExplosive&&!tower.isMortar)continue;
    if(b.type==='ddt'&&b.isCamo&&!tower.camoDet)continue;
    const dx=b.x-tower.x,dy=b.y-tower.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<=tower.range&&b.dist>bestDist){bestDist=b.dist;best=b;}
  }
  return best;
}

function shootTower(tower){
  if(tower.isFarm||tower.isVillage)return;
  if(tower.cooldown>0){tower.cooldown--;return;}

  // SPIKE FACTORY
  if(tower.isSpikeFactory){
    // Place spike pile at a point on path near tower
    const PATH=getPath();let bestPt=null,bestDist=Infinity;
    for(let d=0;d<5000;d+=30){
      const p=posOnPath(d);if(p.done)break;
      const dist=Math.sqrt((p.x-tower.x)**2+(p.y-tower.y)**2);
      if(dist<tower.range&&dist<bestDist){bestDist=dist;bestPt={...p,pathDist:d};}
    }
    if(bestPt){
      state.spikes.push({x:bestPt.x,y:bestPt.y,damage:tower.damage,pierce:tower.pierce,
        life:tower.spikeLife||600,explosive:tower.spikeExplosive||0,blastRadius:tower.blastRadius||0,
        moabMauler:tower.moabMauler||0});
      tower.cooldown=tower.fireRate;
    }
    return;
  }

  // ICE
  if(tower.isFreeze){
    let any=false;
    for(const b of state.bloons){
      if(b.dead)continue;
      const d=Math.sqrt((b.x-tower.x)**2+(b.y-tower.y)**2);
      if(d<=tower.range){
        any=true;
        if(!BLOON_TYPES[b.type].isMoabClass)b.frozenTimer=Math.round(tower.freezeDuration);
        if(tower.damage>0)takeDamage(b,tower.damage);
      }
    }
    if(any){tower.cooldown=tower.fireRate;burst(tower.x,tower.y,'#00bfff',4);}
    return;
  }

  const target=findTarget(tower);
  if(!target)return;
  tower.cooldown=tower.fireRate;
  if(tower.moneyPerShot)state.money+=tower.moneyPerShot;

  const dx=target.x-tower.x,dy=target.y-tower.y,len=Math.sqrt(dx*dx+dy*dy)||1;
  if(!tower.isAce)tower.angle=Math.atan2(dy,dx);

  const shoot=(ddx,ddy)=>state.projectiles.push(createProjectile(tower,ddx,ddy,target.id));

  if(tower.spreadShot){
    const n=tower.spreadShot;
    for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2;shoot(Math.cos(a),Math.sin(a));}
  } else if(tower.spreadTriple||tower.isHeli){
    for(let i=-1;i<=1;i++){const a=Math.atan2(dy,dx)+i*.22;shoot(Math.cos(a),Math.sin(a));}
  } else if(tower.quadShot){
    for(let i=-1;i<=2;i++){const a=Math.atan2(dy,dx)+i*.22;shoot(Math.cos(a),Math.sin(a));}
  } else if(tower.dualShot){
    shoot(dx/len,dy/len);
    const a=Math.atan2(dy,dx)+.25;shoot(Math.cos(a),Math.sin(a));
  } else {
    shoot(dx/len,dy/len);
  }
}

// ===== CHAIN LIGHTNING =====
function chainLightning(startBloon,dmg,jumps,hit){
  if(jumps<=0||!startBloon||startBloon.dead)return;
  hit=hit||new Set([startBloon.id]);
  takeDamage(startBloon,dmg);
  burst(startBloon.x,startBloon.y,'#00ffff',4);
  // find nearest not yet hit
  let next=null,nd=99999;
  for(const b of state.bloons){
    if(b.dead||hit.has(b.id))continue;
    const d=Math.sqrt((b.x-startBloon.x)**2+(b.y-startBloon.y)**2);
    if(d<120&&d<nd){nd=d;next=b;}
  }
  if(next){hit.add(next.id);chainLightning(next,dmg,jumps-1,hit);}
}

// ===== EXPLODE =====
function explodeAt(proj,x,y){
  for(const b of state.bloons){
    if(b.dead||proj.hit.has(b.id))continue;
    const d=Math.sqrt((b.x-x)**2+(b.y-y)**2);
    if(d<=proj.blastRadius){
      let dmg=proj.damage;
      if(proj.moabMauler&&BLOON_TYPES[b.type].isMoabClass)dmg*=(proj.moabMulti||10);
      if(proj.moabElim&&BLOON_TYPES[b.type].isMoabClass)dmg*=20;
      takeDamage(b,dmg);proj.hit.add(b.id);
      if(proj.mortarFT&&!BLOON_TYPES[b.type].isMoabClass)b.frozenTimer=proj.mortarFT;
    }
  }
  state.explosions.push({x,y,r:4,maxR:proj.blastRadius,life:18,maxLife:18});
  burst(x,y,'#ff6600',12);burst(x,y,'#ffcc00',8);
}

// ===== UPDATE PROJECTILE =====
function updateProjectile(proj){
  if(proj.dead)return;
  proj.x+=proj.dx*proj.speed;proj.y+=proj.dy*proj.speed;
  if(proj.x<-60||proj.x>760||proj.y<-60||proj.y>580){proj.dead=true;return;}

  if(proj.isExplosive&&!proj.onHitExplode){
    for(const b of state.bloons){
      if(b.dead)continue;
      const bt=BLOON_TYPES[b.type];
      if(Math.sqrt((b.x-proj.x)**2+(b.y-proj.y)**2)<bt.size+proj.size){
        explodeAt(proj,proj.x,proj.y);proj.dead=true;return;
      }
    }
    const target=state.bloons.find(b=>!b.dead&&b.id===proj.targetId);
    if(!target){explodeAt(proj,proj.x,proj.y);proj.dead=true;}
    return;
  }

  for(const b of state.bloons){
    if(b.dead||proj.hit.has(b.id))continue;
    if(BLOON_TYPES[b.type].isCamo&&!proj.towerRef?.camoDet)continue;
    const bt=BLOON_TYPES[b.type];
    if(Math.sqrt((b.x-proj.x)**2+(b.y-proj.y)**2)<=bt.size+proj.size/2){
      proj.hit.add(b.id);
      if(proj.isGlue){
        b.gluedTimer=proj.slowDuration;b.slowFactor=proj.slowFactor;
        if(proj.glueDot){b.glueDot=true;b.glueDotDmg=proj.glueDotDmg;}
        if(proj.damage>0)takeDamage(b,proj.damage);
      } else if(proj.onHitExplode){
        let dmg=proj.damage;
        if(proj.moabMauler&&BLOON_TYPES[b.type].isMoabClass)dmg*=(proj.moabMulti||10);
        takeDamage(b,dmg);explodeAt(proj,proj.x,proj.y);
      } else {
        let dmg=proj.damage;
        if(proj.moabMauler&&BLOON_TYPES[b.type].isMoabClass)dmg*=(proj.moabMulti||10);
        if(proj.moabElim&&BLOON_TYPES[b.type].isMoabClass)dmg*=20;
        takeDamage(b,dmg);
        if(proj.ninjaFT&&!BLOON_TYPES[b.type].isMoabClass)b.frozenTimer=proj.ninjaFT;
        if(proj.lightning&&proj.lightningJumps>0)chainLightning(b,proj.damage,proj.lightningJumps);
      }
      proj.pierce--;
      if(proj.pierce<=0){proj.dead=true;return;}
    }
  }
}

// ===== UPDATE =====
function update(){
  if(state.gameOver||state.victory)return;
  state.frame++;

  // spawn
  if(state.waveActive&&state.spawnQueue.length>0){
    state.spawnTimer++;
    while(state.spawnQueue.length>0&&state.spawnQueue[0].delay<=state.spawnTimer)
      state.bloons.push(spawnBloon(state.spawnQueue.shift().type));
  }

  // move bloons
  for(const b of state.bloons){
    if(b.dead)continue;
    if(b.frozenTimer>0){b.frozenTimer--;continue;}
    if(b.gluedTimer>0)b.gluedTimer--;else b.slowFactor=1;
    if(b.glueDot&&b.gluedTimer>0&&state.frame%60===0)takeDamage(b,b.glueDotDmg||1);
    b.dist+=b.speed*(b.gluedTimer>0?b.slowFactor:1);
    const p=posOnPath(b.dist);b.x=p.x;b.y=p.y;
    if(p.done){state.lives-=BLOON_TYPES[b.type].hp;burst(b.x,b.y,'#ff0000',5);b.dead=true;
      if(state.lives<=0){state.lives=0;endGame(false);return;}updateUI();}
  }
  state.bloons=state.bloons.filter(b=>!b.dead);

  // towers
  for(const t of state.towers)shootTower(t);

  // spikes
  for(const sp of state.spikes){
    sp.life--;
    for(const b of state.bloons){
      if(b.dead)continue;
      if(Math.sqrt((b.x-sp.x)**2+(b.y-sp.y)**2)<BLOON_TYPES[b.type].size+6){
        let dmg=sp.damage;
        if(sp.moabMauler&&BLOON_TYPES[b.type].isMoabClass)dmg*=5;
        takeDamage(b,dmg);sp.pierce--;
        if(sp.explosive&&sp.pierce<=0){
          // mini explosion
          const fakeProj={damage:sp.damage,blastRadius:sp.blastRadius,hit:new Set(),moabMauler:sp.moabMauler,moabMulti:1,moabElim:0,mortarFT:0};
          explodeAt(fakeProj,sp.x,sp.y);
        }
        if(sp.pierce<=0){sp.life=0;}
      }
    }
  }
  state.spikes=state.spikes.filter(s=>s.life>0);

  // projectiles
  for(const p of state.projectiles)updateProjectile(p);
  state.projectiles=state.projectiles.filter(p=>!p.dead);

  // particles
  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;p.life--;}
  state.particles=state.particles.filter(p=>p.life>0);

  // explosions
  for(const e of state.explosions){e.r=e.maxR*(1-e.life/e.maxLife);e.life--;}
  state.explosions=state.explosions.filter(e=>e.life>0);

  // wave done
  if(state.waveActive&&state.spawnQueue.length===0&&state.bloons.length===0){
    state.waveActive=false;
    if(state.round>=state.maxRound){endGame(true);return;}
    for(const t of state.towers){
      if(t.supplyDrop)state.money+=t.supplyAmt||0;
      if(t.farmPerRound)state.money+=t.farmPerRound;
      if(t.monkeyBank)state.money=Math.round(state.money*1.15);
    }
    state.round++;
    state.money+=100+state.round*10;
    updateUI();
    document.getElementById('start-btn').disabled=false;
  }
}

// ===== DRAW =====
function drawPathOnCtx(c,path,grassColor,w,h,sx,sy,ox,oy){
  c.fillStyle=grassColor;c.fillRect(0,0,w,h);
  c.strokeStyle='#b8944e';c.lineWidth=Math.max(3,14*Math.min(sx,sy));c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(path[0].x*sx+ox,path[0].y*sy+oy);
  for(let i=1;i<path.length;i++)c.lineTo(path[i].x*sx+ox,path[i].y*sy+oy);c.stroke();
  c.strokeStyle='#c8a46e';c.lineWidth=Math.max(2,10*Math.min(sx,sy));
  c.beginPath();c.moveTo(path[0].x*sx+ox,path[0].y*sy+oy);
  for(let i=1;i<path.length;i++)c.lineTo(path[i].x*sx+ox,path[i].y*sy+oy);c.stroke();
}

function draw(){
  if(!currentMap)return;
  ctx.clearRect(0,0,700,520);
  const P=getPath();
  drawPathOnCtx(ctx,P,currentMap.grassColor,700,520,1,1,0,0);
  // dashed guide
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.setLineDash([12,8]);
  ctx.beginPath();ctx.moveTo(P[0].x,P[0].y);
  for(let i=1;i<P.length;i++)ctx.lineTo(P[i].x,P[i].y);ctx.stroke();ctx.setLineDash([]);
  // markers
  ctx.fillStyle='#27ae60';ctx.beginPath();ctx.arc(P[0].x,P[0].y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('IN',P[0].x,P[0].y);
  ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(P[P.length-1].x,P[P.length-1].y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText('OUT',P[P.length-1].x,P[P.length-1].y);

  // tower range preview
  if(state.selectedTowerType&&state.hoveredPos){
    const{x,y}=state.hoveredPos,tt=state.selectedTowerType;
    const occ=state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25);
    const valid=!isOnPath(x,y)&&!occ;
    if(tt.range>0&&tt.range<900){
      ctx.beginPath();ctx.arc(x,y,tt.range,0,Math.PI*2);
      ctx.fillStyle=valid?'rgba(255,255,255,.06)':'rgba(255,0,0,.06)';ctx.fill();
      ctx.strokeStyle=valid?'rgba(255,255,255,.3)':'rgba(255,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
    }
    ctx.globalAlpha=valid?.7:.3;
    ctx.fillStyle=tt.color;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // village auras
  for(const t of state.towers){
    if(t.isVillage){
      ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.fillStyle='rgba(255,220,80,.06)';ctx.fill();
      ctx.strokeStyle='rgba(255,220,80,.3)';ctx.lineWidth=1;ctx.stroke();
    }
  }

  // explosions
  for(const e of state.explosions){
    const tt=e.life/e.maxLife;
    ctx.globalAlpha=tt*.6;ctx.strokeStyle='#ff8800';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
    const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
    g.addColorStop(0,`rgba(255,220,50,${tt*.55})`);g.addColorStop(.4,`rgba(255,100,0,${tt*.4})`);g.addColorStop(1,'rgba(255,40,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.lineWidth=1;

  // spikes
  for(const s of state.spikes){
    ctx.fillStyle='#8b0000';ctx.font='12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚡',s.x,s.y);
  }

  // towers
  for(const t of state.towers){
    if(state.selectedTower===t&&t.range>0&&t.range<900){
      ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.save();ctx.translate(t.x,t.y);
    if(!t.isFarm&&!t.isVillage&&!t.isSpikeFactory)ctx.rotate(t.angle);
    ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=state.selectedTower===t?'#f0e040':'rgba(255,255,255,.35)';
    ctx.lineWidth=state.selectedTower===t?3:1.5;ctx.stroke();
    if(t.isFreeze){ctx.fillStyle='#00bfff';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();}
    else if(t.isGlue){ctx.fillStyle='#c8c800';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();}
    else if(!t.isFarm&&!t.isVillage&&!t.isSpikeFactory){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(5,-4,16,8);}
    ctx.restore();
    ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.icon,t.x,t.y);
    const pc=['#f0e040','#e74c3c','#9b59b6'];
    for(let p=0;p<3;p++)for(let l=0;l<t.upgrades[p];l++){
      ctx.fillStyle=pc[p];ctx.beginPath();ctx.arc(t.x-8+p*8,t.y+21,2.2,0,Math.PI*2);ctx.fill();
    }
  }

  // bloons
  for(const b of state.bloons){
    if(b.dead)continue;
    const bt=BLOON_TYPES[b.type];
    ctx.save();ctx.translate(b.x,b.y);
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(2,4,bt.size*.8,bt.size*.4,0,0,Math.PI*2);ctx.fill();
    if(b.frozenTimer>0){ctx.fillStyle='#b0e8ff';ctx.beginPath();ctx.arc(0,0,bt.size+2,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=bt.color;ctx.beginPath();ctx.arc(0,0,bt.size,0,Math.PI*2);ctx.fill();
    if(b.gluedTimer>0){ctx.fillStyle='rgba(200,200,0,.4)';ctx.beginPath();ctx.arc(0,0,bt.size,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle=bt.border||'rgba(255,255,255,.5)';ctx.lineWidth=bt.borderW||1;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(-bt.size*.3,-bt.size*.35,bt.size*.3,0,Math.PI*2);ctx.fill();
    if(bt.hp>5){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(-bt.size,-bt.size-6,bt.size*2,4);
      ctx.fillStyle=b.hp/bt.hp>.5?'#27ae60':'#e74c3c';
      ctx.fillRect(-bt.size,-bt.size-6,bt.size*2*(b.hp/bt.hp),4);
    }
    ctx.restore();
  }

  // projectiles
  for(const p of state.projectiles){
    ctx.fillStyle=p.color||'#fff';
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,p.size/2),0,Math.PI*2);ctx.fill();
  }

  // particles
  for(const p of state.particles){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(10,10,220,32,6);ctx.fill();
  ctx.textBaseline='middle';const cy=26;
  ctx.font='15px Arial';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('❤️',18,cy);
  ctx.font='bold 14px Arial';ctx.fillStyle='#ff6b6b';ctx.fillText(Math.max(0,state.lives),40,cy);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(98,16,1,20);
  ctx.font='15px Arial';ctx.fillStyle='#fff';ctx.fillText('🪙',106,cy);
  ctx.font='bold 14px Arial';ctx.fillStyle='#f0e040';ctx.fillText('$'+state.money,128,cy);
  // Round indicator – top right
  const roundTxt='Runde '+state.round+' / '+state.maxRound;
  ctx.font='bold 14px Arial';ctx.textAlign='right';
  const rw=ctx.measureText(roundTxt).width+28;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(700-10-rw,10,rw,32,6);ctx.fill();
  ctx.font='14px Arial';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText('🎯',700-10-rw+6,cy);
  ctx.font='bold 13px Arial';ctx.fillStyle='#f0e040';ctx.fillText(roundTxt,700-10-rw+24,cy);
}

// ===== UI =====
function getTowerSpent(t){
  let v=TOWER_DEFS.find(d=>d.id===t.typeId).cost;
  const def=TOWER_DEFS.find(d=>d.id===t.typeId);
  for(let p=0;p<3;p++)for(let i=0;i<t.upgrades[p];i++)v+=def.upgrades[p][i].cost;
  return v;
}
function updateUI(){
  document.getElementById('stat-round').textContent=state.round+'/'+state.maxRound;
  document.getElementById('stat-popped').textContent=state.popped;
  document.querySelectorAll('.tower-btn').forEach(btn=>{
    btn.classList.toggle('too-expensive',state.money<parseInt(btn.dataset.cost));
    btn.classList.toggle('selected',state.selectedTowerType&&state.selectedTowerType.id===btn.dataset.id);
  });
  const panel=document.getElementById('upgrade-panel');
  if(!state.selectedTower){panel.style.display='none';return;}
  panel.style.display='block';
  const t=state.selectedTower,def=TOWER_DEFS.find(d=>d.id===t.typeId);
  document.getElementById('upgrade-title').textContent=`${t.name} [${t.upgrades.join('-')}]`;
  const pd=document.getElementById('upgrade-paths');pd.innerHTML='';
  const pc=['#f0e040','#e74c3c','#9b59b6'];
  for(let path=0;path<3;path++){
    const lv=t.upgrades[path],div=document.createElement('div');div.className='upgrade-path';
    const hdr=document.createElement('div');hdr.className='path-header';
    const ns=document.createElement('span');ns.className='path-name';ns.style.color=pc[path];ns.textContent='Pfad '+(path+1);hdr.appendChild(ns);
    const pips=document.createElement('div');pips.className='path-pips';
    for(let i=0;i<5;i++){const pip=document.createElement('div');pip.className='pip'+(i<lv?' filled'+(i>=4?' t5':i>=3?' t4':i>=2?' t3':''):'');pips.appendChild(pip);}
    hdr.appendChild(pips);div.appendChild(hdr);
    for(let tier=0;tier<5;tier++){
      const u=def.upgrades[path][tier],done=lv>tier,isNext=lv===tier;
      const canDo=canUpgradePath(t,path),canAff=state.money>=u.cost;
      const tc=tier>=4?'t5':tier>=3?'t4':tier>=2?'t3':'';
      const btn=document.createElement('button');
      btn.className='upgrade-tier-btn'+(done?' done':tc?' '+tc:'');
      btn.disabled=done||!isNext||!canDo||!canAff;
      btn.innerHTML=`<span>${tier+1}.${u.name}</span><span class="tier-cost">${done?'✓':(!canDo&&isNext?'🔒':'$'+u.cost)}</span>`;
      btn.title=u.desc;
      if(isNext&&canDo&&canAff)btn.onclick=()=>{state.money-=u.cost;applyUpgrade(t,path);updateUI();};
      div.appendChild(btn);
    }
    pd.appendChild(div);
  }
  const sv=Math.round(getTowerSpent(t)*.7);
  document.getElementById('sell-btn').textContent=`Verkaufen ($${sv})`;
  document.getElementById('sell-btn').onclick=()=>{state.money+=sv;state.towers=state.towers.filter(x=>x!==t);state.selectedTower=null;updateUI();};
}

function buildTowerButtons(){
  const c=document.getElementById('tower-buttons');c.innerHTML='';
  TOWER_DEFS.forEach(def=>{
    const btn=document.createElement('button');
    btn.className='tower-btn';btn.dataset.id=def.id;btn.dataset.cost=def.cost;
    btn.innerHTML=`<div class="tower-icon" style="background:${def.color}">${def.icon}</div>
      <div class="tower-info"><div class="tower-name">${def.name}</div><div class="tower-cost">$${def.cost}</div></div>`;
    btn.onclick=()=>{
      if(state.money<def.cost)return;
      state.selectedTowerType=(state.selectedTowerType===def)?null:def;
      state.selectedTower=null;updateUI();
    };
    c.appendChild(btn);
  });
}

// ===== EVENTS =====
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();state.hoveredPos={x:e.clientX-r.left,y:e.clientY-r.top};});
canvas.addEventListener('mouseleave',()=>{state.hoveredPos=null;});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(state.selectedTowerType){
    const def=state.selectedTowerType;
    if(state.money<def.cost)return;
    if(!def.isFarm&&!def.isVillage&&!def.isSpikeFactory&&isOnPath(x,y))return;
    if(state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25))return;
    state.money-=def.cost;state.towers.push(createTower(def,x,y));
    state.selectedTowerType=null;updateUI();return;
  }
  const found=state.towers.find(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<18);
  state.selectedTower=(found&&state.selectedTower===found)?null:(found||null);
  updateUI();
});
document.getElementById('start-btn').onclick=()=>{
  if(state.waveActive||state.gameOver||state.victory)return;
  state.waveActive=true;state.spawnQueue=makeWave(state.round);state.spawnTimer=0;
  document.getElementById('start-btn').disabled=true;
};
document.getElementById('speed-btn').onclick=()=>{
  state.speed=state.speed===1?2:1;
  document.getElementById('speed-btn').textContent=state.speed===2?'⏩ 1x Speed':'⏩ 2x Speed';
};
document.getElementById('back-btn').onclick=()=>goToMenu();
document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('start-btn').click();});

// ===== GAME LOOP =====
function gameLoop(){for(let i=0;i<state.speed;i++)update();draw();requestAnimationFrame(gameLoop);}

function endGame(win){
  state.gameOver=!win;state.victory=win;
  document.getElementById('msg-title').textContent=win?'🎉 GEWONNEN!':'💀 GAME OVER';
  document.getElementById('msg-sub').textContent=win?`Alle 60 Runden überlebt! Gepoppt: ${state.popped}`:`Runde ${state.round} – Gepoppt: ${state.popped}`;
  document.getElementById('message').style.display='block';
}
function restartGame(){
  document.getElementById('message').style.display='none';
  initState(currentMap);buildTowerButtons();updateUI();
  document.getElementById('start-btn').disabled=false;
}
function goToMenu(){
  document.getElementById('message').style.display='none';
  document.getElementById('game-wrapper').style.display='none';
  document.getElementById('map-select').style.display='flex';
}
function startGame(map){
  document.getElementById('map-select').style.display='none';
  document.getElementById('game-wrapper').style.display='flex';
  initState(map);buildTowerButtons();updateUI();
}

// ===== MAP SELECT =====
function buildMapSelect(){
  const grid=document.getElementById('map-grid');grid.innerHTML='';
  MAP_DEFS.forEach(m=>{
    const card=document.createElement('div');card.className='map-card';
    const pc=document.createElement('canvas');pc.width=200;pc.height=125;
    const c=pc.getContext('2d'),sx=(200-16)/700,sy=(125-16)/520;
    drawPathOnCtx(c,m.path,m.grassColor,200,125,sx,sy,8,8);
    c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=1;c.setLineDash([5,4]);
    c.beginPath();c.moveTo(m.path[0].x*sx+8,m.path[0].y*sy+8);
    for(let i=1;i<m.path.length;i++)c.lineTo(m.path[i].x*sx+8,m.path[i].y*sy+8);
    c.stroke();c.setLineDash([]);
    const p0=m.path[0],pe=m.path[m.path.length-1];
    c.fillStyle='#27ae60';c.beginPath();c.arc(p0.x*sx+8,p0.y*sy+8,4,0,Math.PI*2);c.fill();
    c.fillStyle='#e74c3c';c.beginPath();c.arc(pe.x*sx+8,pe.y*sy+8,4,0,Math.PI*2);c.fill();
    card.appendChild(pc);
    const info=document.createElement('div');info.className='map-card-info';
    info.innerHTML=`<div class="map-card-name">${m.name}</div><div class="map-card-diff ${m.diffClass}">★ ${m.difficulty}</div>`;
    card.appendChild(info);card.onclick=()=>startGame(m);
    grid.appendChild(card);
  });
}

buildMapSelect();
requestAnimationFrame(gameLoop);
</script>
