<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloon Pop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    font-family: 'Arial', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #title {
    font-size: 2rem;
    font-weight: bold;
    color: #f0e040;
    text-shadow: 0 0 20px #f0a000, 2px 2px 0 #a06000;
    padding: 6px 0 2px 0;
    letter-spacing: 3px;
  }
  #game-area {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 4px 10px;
  }
  #canvas {
    border: 3px solid #f0a000;
    border-radius: 6px;
    cursor: crosshair;
    display: block;
  }
  #sidebar {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 530px;
    overflow-y: auto;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 2px; }
  #stats {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.82rem;
  }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .stat-label { color: #aaa; }
  .stat-val { font-weight: bold; color: #f0e040; }
  #towers-panel {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 8px;
  }
  #towers-panel h3 {
    font-size: 0.8rem; color: #aaa; margin-bottom: 6px;
    text-align: center; text-transform: uppercase; letter-spacing: 1px;
  }
  .tower-btn {
    width: 100%; margin-bottom: 5px; padding: 6px 5px;
    border-radius: 6px; border: 2px solid transparent;
    cursor: pointer; font-size: 0.78rem; font-weight: bold;
    transition: all 0.15s; display: flex; align-items: center;
    gap: 7px; background: #0f3460; color: #fff;
  }
  .tower-btn:hover { filter: brightness(1.2); }
  .tower-btn.selected { border-color: #f0e040; box-shadow: 0 0 8px #f0a000; }
  .tower-btn.too-expensive { opacity: 0.4; cursor: not-allowed; }
  .tower-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .tower-name { font-size: 0.78rem; }
  .tower-cost { font-size: 0.7rem; color: #f0e040; }

  /* Upgrade Panel */
  #upgrade-panel {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 8px;
    display: none;
  }
  #upgrade-panel h3 { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; text-align: center; }
  .upgrade-path {
    margin-bottom: 8px;
    background: #0a1a30;
    border-radius: 6px;
    padding: 6px;
  }
  .path-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 5px; font-size: 0.72rem; color: #aaa;
  }
  .path-name { font-weight: bold; }
  .path-pips { display: flex; gap: 3px; }
  .pip {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; border: 1px solid #555;
    transition: all 0.2s;
  }
  .pip.filled { background: #f0e040; border-color: #f0a000; box-shadow: 0 0 4px #f0a000; }
  .pip.filled.t3 { background: #e74c3c; border-color: #c00; box-shadow: 0 0 4px #e74c3c; }
  .pip.filled.t4 { background: #9b59b6; border-color: #7d3c98; box-shadow: 0 0 4px #9b59b6; }
  .pip.filled.t5 { background: #f39c12; border-color: #e67e22; box-shadow: 0 0 6px #f39c12; }
  .upgrade-tier-btn {
    width: 100%; padding: 4px 6px; border-radius: 4px; border: none;
    cursor: pointer; font-size: 0.68rem; font-weight: bold;
    background: #0f5460; color: #fff; margin-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
    transition: all 0.15s;
  }
  .upgrade-tier-btn:hover:not(:disabled) { filter: brightness(1.25); }
  .upgrade-tier-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .upgrade-tier-btn.done { background: #1a3a20; border-left: 3px solid #27ae60; }
  .upgrade-tier-btn.t3 { background: #3a1a0a; border-left: 3px solid #e74c3c; }
  .upgrade-tier-btn.t4 { background: #2a1040; border-left: 3px solid #9b59b6; }
  .upgrade-tier-btn.t5 { background: #3a2000; border-left: 3px solid #f39c12; }
  .tier-cost { color: #f0e040; font-size: 0.65rem; }
  #sell-btn {
    width: 100%; padding: 5px; border-radius: 5px; border: none;
    cursor: pointer; font-size: 0.75rem; font-weight: bold;
    background: #7a0000; color: #fff; transition: all 0.15s; margin-top: 4px;
  }
  #sell-btn:hover { filter: brightness(1.2); }

  #action-btns { display: flex; flex-direction: column; gap: 5px; }
  #start-btn, #speed-btn {
    padding: 9px; border-radius: 8px; border: none;
    cursor: pointer; font-size: 0.88rem; font-weight: bold;
    transition: all 0.15s; width: 100%;
  }
  #start-btn { background: #16a34a; color: #fff; }
  #start-btn:hover:not(:disabled) { filter: brightness(1.15); }
  #start-btn:disabled { background: #444; cursor: not-allowed; }
  #speed-btn { background: #1d4ed8; color: #fff; }
  #speed-btn:hover { filter: brightness(1.15); }

  #bloon-legend {
    background: #16213e; border: 2px solid #0f3460;
    border-radius: 8px; padding: 7px; font-size: 0.7rem;
  }
  #bloon-legend h3 { color: #aaa; margin-bottom: 5px; text-align: center; font-size: 0.73rem; text-transform: uppercase; letter-spacing: 1px; }
  .legend-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  .legend-circle { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); }

  #message {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.93);
    border: 3px solid #f0a000; border-radius: 16px;
    padding: 30px 50px; text-align: center; display: none; z-index: 100;
  }
  #message h2 { font-size: 2rem; margin-bottom: 10px; }
  #message p { color: #aaa; margin-bottom: 20px; }
  #message button {
    padding: 12px 30px; border-radius: 8px; border: none;
    background: #16a34a; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
<div id="title">🎈 BLOON POP 🎈</div>
<div id="game-area">
  <canvas id="canvas" width="700" height="520"></canvas>
  <div id="sidebar">
    <div id="stats">
      <div class="stat-row"><span class="stat-label">❤️ Leben</span><span class="stat-val" id="stat-lives">150</span></div>
      <div class="stat-row"><span class="stat-label">💰 Geld</span><span class="stat-val" id="stat-money">$650</span></div>
      <div class="stat-row"><span class="stat-label">🎯 Runde</span><span class="stat-val" id="stat-round">1 / 30</span></div>
      <div class="stat-row"><span class="stat-label">💥 Gepoppt</span><span class="stat-val" id="stat-popped">0</span></div>
    </div>

    <div id="towers-panel">
      <h3>Türme platzieren</h3>
      <div id="tower-buttons"></div>
    </div>

    <div id="upgrade-panel">
      <h3 id="upgrade-title">Turm</h3>
      <div id="upgrade-paths"></div>
      <button id="sell-btn">Verkaufen</button>
    </div>

    <div id="action-btns">
      <button id="start-btn">▶ Runde starten</button>
      <button id="speed-btn">⏩ 2x Geschwindigkeit</button>
    </div>

    <div id="bloon-legend">
      <h3>Bloon-Typen</h3>
      <div class="legend-row"><div class="legend-circle" style="background:#e74c3c"></div><span>Rot (1 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#3498db"></div><span>Blau (2 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#27ae60"></div><span>Grün (3 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#f39c12"></div><span>Gelb (4 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#ff69b4"></div><span>Pink (5 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#888"></div><span>Schwarz (6 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#8B4513"></div><span>Keramik (10 HP)</span></div>
      <div class="legend-row"><div class="legend-circle" style="background:#d4af37;border:2px solid #8B0000"></div><span>MOAB (50 HP)</span></div>
    </div>
  </div>
</div>

<div id="message">
  <h2 id="msg-title"></h2>
  <p id="msg-sub"></p>
  <button onclick="restartGame()">Neu starten</button>
</div>

<script>
// =====================================================================
// PATH
// =====================================================================
const PATH = [
  {x:0,   y:130},
  {x:160, y:130},
  {x:160, y:60},
  {x:380, y:60},

  {x:240, y:230},
  {x:240, y:370},

// =====================================================================
// BLOON TYPES

        { name:'Tech Terror',      cost:5000,desc:'+10 Dmg, Laserstrahlen', apply:t=>{ t.isLaser=true; t.damage+=10; t.pierce=20; t.fireRate=Math.max(2,t.fireRate); } },
      ],
      // Path 2 – Reichweite

      ],
      // Path 1 – Feuerrate
      [
        { name:'Schnelleres Nachladen', cost:150, desc:'Feuerrate +35%',apply:t=>{ t.fireRate=Math.ceil(t.fireRate*0.65); } },

// =====================================================================
// WAVES
// =====================================================================
function makeWave(round) {
  const bloons = [];
  const r = round;
  function add(type, count, interval=20, offset=0) {
    for(let i=0;i<count;i++) bloons.push({type, delay: offset+i*interval});
  }
  if(r<=2)       { add('red',8+r*4); }
  else if(r<=4)  { add('red',10+r*3); add('blue',r*3,25,20); }
  else if(r<=7)  { add('blue',r*5,20); add('green',r*2,30,30); }
  else if(r<=10) { add('green',r*3,22); add('yellow',r*2,32,40); }
  else if(r<=13) { add('yellow',r*3,20); add('pink',r*2,28,50); }
  else if(r<=16) { add('pink',r*3,18); add('black',r,35); }
  else if(r<=20) { add('black',r*2,20); add('pink',r,25,10); }
  else if(r<=23) { add('ceramic',Math.floor(r*1.5),28); add('black',r,22,20); }
  else if(r<=26) { add('ceramic',r*2,20); add('moab',Math.floor(r/6),90); }
  else if(r<=29) { add('ceramic',r,22); add('moab',Math.floor(r/4),80); add('black',r/2,25,10); }
  else           { add('moab',6,70); add('ceramic',25,14); add('pink',20,12,10); }
  bloons.sort((a,b)=>a.delay-b.delay);
  return bloons;
}

// =====================================================================
// PATH HELPERS
// =====================================================================
function posOnPath(dist) {
  let rem = dist;
  for(let i=1;i<PATH.length;i++) {
    const dx=PATH[i].x-PATH[i-1].x, dy=PATH[i].y-PATH[i-1].y;
    const seg=Math.sqrt(dx*dx+dy*dy);
    if(rem<=seg) {
      const t=rem/seg;
      return {x:PATH[i-1].x+dx*t, y:PATH[i-1].y+dy*t, done:false};
    }
    rem-=seg;
  }
  return {x:PATH[PATH.length-1].x, y:PATH[PATH.length-1].y, done:true};
}

function isOnPath(x, y, margin=20) {
  for(let i=1;i<PATH.length;i++) {
    const ax=PATH[i-1].x, ay=PATH[i-1].y, bx=PATH[i].x, by=PATH[i].y;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/len2));
    const px=ax+t*dx, py=ay+t*dy;
    if(Math.sqrt((x-px)**2+(y-py)**2)<margin) return true;
  }
  return false;
}

// =====================================================================
// UPGRADE SYSTEM – BTD6 style
// Rules:
//   - Max 2 paths can be non-zero
//   - At most one path can be at tier 3+
//   - If one path is 3+, other paths can be at most 2
// tower.upgrades = [p0level, p1level, p2level]
// =====================================================================
function canUpgradePath(tower, path) {
  const levels = tower.upgrades;
  const current = levels[path];
  if(current >= 5) return false; // already maxed
  const next = current + 1;

  // Rule: only 2 paths can be non-zero
  const nonZeroPaths = levels.filter(l=>l>0).length;
  if(current === 0 && nonZeroPaths >= 2) return false;

  // Rule: only one path can be at 3+
  if(next >= 3) {
    for(let i=0;i<3;i++) {
      if(i!==path && levels[i]>=3) return false;
    }
  }
  // Rule: if another path is at 3+, this path max 2
  const otherHigh = levels.some((l,i)=>i!==path && l>=3);
  if(otherHigh && next > 2) return false;

  return true;
}

function upgradePathCost(tower, path) {
  const def = TOWER_DEFS.find(d=>d.id===tower.typeId);
  const level = tower.upgrades[path];
  if(level>=5) return Infinity;
  return def.upgrades[path][level].cost;
}

function applyUpgrade(tower, path) {
  const def = TOWER_DEFS.find(d=>d.id===tower.typeId);
  const level = tower.upgrades[path];
  def.upgrades[path][level].apply(tower);
  tower.upgrades[path]++;
}

// =====================================================================
// BLOON
// =====================================================================
let bloonId=0;
function spawnBloon(type) {
  const bt=BLOON_TYPES[type];
  return {
    id:bloonId++, type, hp:bt.hp, maxHp:bt.hp,
    speed:bt.speed, dist:0, x:PATH[0].x, y:PATH[0].y,
    frozenTimer:0, gluedTimer:0, slowFactor:1, glueDot:false, glueDotDmg:1,
  };
}

// =====================================================================
// TOWER
// =====================================================================
let towerUid=0;
function createTower(def, x, y) {
  // uid = unique instance ID, typeId = type string ('dart', etc.)
  // We copy all def properties but keep typeId separate
  const t = {
    ...def,
    uid: towerUid++,
    typeId: def.id,   // keep the type string
    x, y,
    angle: 0,
    cooldown: 0,
    upgrades: [0, 0, 0],  // [path0_level, path1_level, path2_level]
    supplyDrop: false,
    moneyPerShot: 0,
    totalSpent: def.cost,
  };
  return t;
}

// =====================================================================
// PROJECTILE
// =====================================================================
let projId=0;
function createProjectile(tower, tdx, tdy, targetId) {
  return {
    id:projId++,
    x:tower.x, y:tower.y, dx:tdx, dy:tdy,
    speed:tower.projectileSpeed,
    damage:tower.damage,
    pierce:tower.pierce,
    hit:new Set(),
    towerRef:tower,
    targetId: targetId||null,
    isExplosive:tower.isExplosive||false,
    onHitExplode:tower.onHitExplode||false,
    blastRadius:tower.blastRadius||0,
    isGlue:tower.isGlue||false,
    slowFactor:tower.slowFactor||1,
    slowDuration:tower.slowDuration||0,
    glueDot:tower.glueDot||false,
    glueDotDmg:tower.glueDotDmg||1,
    moabMauler:tower.moabMauler||false,
    moabElim:tower.moabElim||false,
    color:tower.projectileColor,
    size:tower.projectileSize,
    bouncing:tower.bouncing||0,
    isLaser:tower.isLaser||false,
  };
}

// =====================================================================
// PARTICLES
// =====================================================================
function burst(x, y, color, count=8) {
  for(let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,maxLife:50,color,size:2+Math.random()*3});
  }
}

// =====================================================================
// DAMAGE
// =====================================================================
function takeDamage(bloon, dmg) {
  if(!bloon||bloon.dead) return;
  bloon.hp-=dmg;
  if(bloon.hp<=0) killBloon(bloon);
}

function killBloon(bloon) {
  const bt=BLOON_TYPES[bloon.type];
  state.money+=bt.reward;
  state.popped++;
  burst(bloon.x,bloon.y,bt.color,bloon.type==='moab'?20:8);
  bloon.dead=true;
  if(bloon.type==='moab') {
    for(let i=0;i<4;i++) {
      const b=spawnBloon('ceramic');
      b.dist=bloon.dist;
      const p=posOnPath(b.dist); b.x=p.x; b.y=p.y;
      state.bloons.push(b);
    }
  }
  updateUI();
}

// =====================================================================
// TOWER AI
// =====================================================================
function findTarget(tower) {
  let best=null, bestDist=-1;
  for(const b of state.bloons) {
    if(b.dead) continue;
    // bombs can target frozen bloons; others skip them
    if(b.frozenTimer>0 && !tower.isExplosive) continue;
    const dx=b.x-tower.x, dy=b.y-tower.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<=tower.range && b.dist>bestDist) { bestDist=b.dist; best=b; }
  }
  return best;
}

function shootTower(tower) {
  if(tower.cooldown>0) { tower.cooldown--; return; }

  // ICE TOWER
  if(tower.isFreeze) {
    let anyInRange=false;
    for(const b of state.bloons) {
      if(b.dead) continue;
      const dx=b.x-tower.x, dy=b.y-tower.y;
      if(Math.sqrt(dx*dx+dy*dy)<=tower.range) {
        anyInRange=true;
        if(b.type!=='moab') {
          b.frozenTimer=Math.round(tower.freezeDuration);
        }
        if(tower.damage>0) takeDamage(b,tower.damage);
      }
    }
    if(anyInRange) { tower.cooldown=tower.fireRate; burst(tower.x,tower.y,'#00bfff',4); }
    return;
  }

  const target=findTarget(tower);
  if(!target) return;
  tower.cooldown=tower.fireRate;

  const dx=target.x-tower.x, dy=target.y-tower.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  tower.angle=Math.atan2(dy,dx);

  if(tower.moneyPerShot) state.money+=tower.moneyPerShot;

  if(tower.spreadShot) {
    const n=tower.spreadShot;
    for(let i=0;i<n;i++) {
      const a=(i/n)*Math.PI*2;
      state.projectiles.push(createProjectile(tower,Math.cos(a),Math.sin(a),target.id));
    }
  } else if(tower.tripleShot||tower.spreadTriple) {
    for(let i=-1;i<=1;i++) {
      const a=Math.atan2(dy,dx)+i*0.18;
      state.projectiles.push(createProjectile(tower,Math.cos(a),Math.sin(a),target.id));
    }
  } else {
    state.projectiles.push(createProjectile(tower,dx/len,dy/len,target.id));
  }
}

// =====================================================================
// PROJECTILE LOGIC
// =====================================================================
function explodeAt(proj, x, y) {
  for(const b of state.bloons) {
    if(b.dead||proj.hit.has(b.id)) continue;
    const dx=b.x-x, dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<=proj.blastRadius) {
      let dmg=proj.damage;
      if(proj.moabMauler&&b.type==='moab') dmg*=10;
      if(proj.moabElim&&b.type==='moab') dmg*=20;
      takeDamage(b,dmg);
      proj.hit.add(b.id);
    }
  }
  // Visual explosion
  state.explosions.push({x, y, r: 4, maxR: proj.blastRadius, life: 18, maxLife: 18});
  burst(x, y, '#ff6600', 12);
  burst(x, y, '#ffcc00', 8);
}

function updateProjectile(proj) {
  if(proj.dead) return;
  proj.x+=proj.dx*proj.speed;
  proj.y+=proj.dy*proj.speed;
  if(proj.x<-60||proj.x>760||proj.y<-60||proj.y>580) { proj.dead=true; return; }

  if(proj.isExplosive && !proj.onHitExplode) {
    // Explode on contact with any bloon
    for(const b of state.bloons) {
      if(b.dead) continue;
      const bt=BLOON_TYPES[b.type];
      const dx=b.x-proj.x, dy=b.y-proj.y;
      if(Math.sqrt(dx*dx+dy*dy)<bt.size+proj.size) {
        explodeAt(proj,proj.x,proj.y);
        proj.dead=true;
        return;
      }
    }
    // Target died before arrival – explode at current pos if close enough to where it was
    const target=state.bloons.find(b=>!b.dead&&b.id===proj.targetId);
    if(!target) { explodeAt(proj,proj.x,proj.y); proj.dead=true; }
    return;
  }

  // Hit detection
  for(const b of state.bloons) {
    if(b.dead||proj.hit.has(b.id)) continue;
    const bt=BLOON_TYPES[b.type];
    const dx=b.x-proj.x, dy=b.y-proj.y;
    if(Math.sqrt(dx*dx+dy*dy)<=bt.size+proj.size/2) {
      proj.hit.add(b.id);

      if(proj.isGlue) {
        b.gluedTimer=proj.slowDuration;
        b.slowFactor=proj.slowFactor;
        if(proj.glueDot) { b.glueDot=true; b.glueDotDmg=proj.glueDotDmg; }
        if(proj.damage>0) takeDamage(b,proj.damage);
      } else if(proj.onHitExplode) {
        let dmg=proj.damage;
        if(proj.moabMauler&&b.type==='moab') dmg*=10;
        takeDamage(b,dmg);
        explodeAt(proj,proj.x,proj.y);
      } else {
        let dmg=proj.damage;
        if(proj.moabMauler&&b.type==='moab') dmg*=10;
        if(proj.moabElim&&b.type==='moab') dmg*=20;
        takeDamage(b,dmg);
      }
      proj.pierce--;
      if(proj.pierce<=0) { proj.dead=true; return; }
    }
  }
}

// =====================================================================
// UPDATE
// =====================================================================
function update() {
  if(state.gameOver||state.victory) return;
  state.frame++;

  // Spawn
  if(state.waveActive && state.spawnQueue.length>0) {
    state.spawnTimer++;
    while(state.spawnQueue.length>0 && state.spawnQueue[0].delay<=state.spawnTimer)
      state.bloons.push(spawnBloon(state.spawnQueue.shift().type));
  }

  // Move bloons
  for(const b of state.bloons) {
    if(b.dead) continue;
    if(b.frozenTimer>0) { b.frozenTimer--; continue; }
    if(b.gluedTimer>0) b.gluedTimer--;
    else b.slowFactor=1;

    if(b.glueDot && b.gluedTimer>0 && state.frame%60===0)
      takeDamage(b, b.glueDotDmg||1);

    const spd=b.speed*(b.gluedTimer>0 ? b.slowFactor : 1);
    b.dist+=spd;
    const p=posOnPath(b.dist);
    b.x=p.x; b.y=p.y;
    if(p.done) {
      state.lives-=BLOON_TYPES[b.type].hp;
      burst(b.x,b.y,'#ff0000',5);
      b.dead=true;
      if(state.lives<=0) { state.lives=0; endGame(false); return; }
      updateUI();
    }
  }
  state.bloons=state.bloons.filter(b=>!b.dead);

  // Towers shoot
  for(const t of state.towers) shootTower(t);

  // Move projectiles
  for(const p of state.projectiles) updateProjectile(p);
  state.projectiles=state.projectiles.filter(p=>!p.dead);

  // Particles
  for(const p of state.particles) { p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life--; }
  state.particles=state.particles.filter(p=>p.life>0);

  // Explosions
  for(const e of state.explosions) { e.r=e.maxR*(1-e.life/e.maxLife); e.life--; }
  state.explosions=state.explosions.filter(e=>e.life>0);

  // Wave done?
  if(state.waveActive && state.spawnQueue.length===0 && state.bloons.length===0) {
    state.waveActive=false;
    if(state.round>=state.maxRound) { endGame(true); return; }
    // Supply drop towers
    for(const t of state.towers) {
      if(t.supplyDrop) state.money+=500;
    }
    state.round++;
    state.money+=100+state.round*10;
    updateUI();
    document.getElementById('start-btn').disabled=false;
  }
}

// =====================================================================
// DRAW
// =====================================================================
function drawScene() {
  // grass
  ctx.fillStyle='#3a7d44';
  ctx.fillRect(0,0,700,520);

  // path dirt (outline)
  ctx.strokeStyle='#b8944e'; ctx.lineWidth=36;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke();
  // path dirt (inner)
  ctx.strokeStyle='#c8a46e'; ctx.lineWidth=30;
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke();
  // dashed guide
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
  ctx.setLineDash([12,8]);
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke(); ctx.setLineDash([]);

  // start/end markers
  ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(PATH[0].x,PATH[0].y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 8px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('IN',PATH[0].x,PATH[0].y);
  ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(PATH[PATH.length-1].x,PATH[PATH.length-1].y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText('OUT',PATH[PATH.length-1].x,PATH[PATH.length-1].y);
}

function drawHUD() {
  const pad=10, h=32;
  // halbtransparenter Hintergrund
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.roundRect(pad, pad, 210, h, 6);
  ctx.fill();

  ctx.textBaseline='middle';
  const cy=pad+h/2;

  // Herz
  ctx.font='16px Arial';
  ctx.textAlign='left';
  ctx.fillText('❤️', pad+8, cy);

  // Leben-Wert
  ctx.font='bold 15px Arial';
  ctx.fillStyle='#ff6b6b';
  ctx.fillText(Math.max(0,state.lives), pad+30, cy);

  // Trenner
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(pad+85, pad+6, 1, h-12);

  // Coin
  ctx.font='16px Arial';
  ctx.fillText('🪙', pad+96, cy);

  // Geld-Wert
  ctx.font='bold 15px Arial';
  ctx.fillStyle='#f0e040';
  ctx.fillText('$'+state.money, pad+118, cy);
}

function drawTowerPreview() {
  if(!state.selectedTowerType||!state.hoveredPos) return;
  const {x,y}=state.hoveredPos;
  const tt=state.selectedTowerType;
  const occupied=state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25);
  const valid=!isOnPath(x,y)&&!occupied;
  ctx.beginPath(); ctx.arc(x,y,tt.range,0,Math.PI*2);
  ctx.fillStyle=valid?'rgba(255,255,255,0.06)':'rgba(255,0,0,0.06)'; ctx.fill();
  ctx.strokeStyle=valid?'rgba(255,255,255,0.3)':'rgba(255,0,0,0.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.globalAlpha=valid?0.7:0.3;
  ctx.fillStyle=tt.color; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

function drawTowers() {
  for(const t of state.towers) {
    if(state.selectedTower===t) {
      ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
    ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=state.selectedTower===t?'#f0e040':'rgba(255,255,255,0.35)';
    ctx.lineWidth=state.selectedTower===t?3:1.5; ctx.stroke();
    if(t.isFreeze) {
      ctx.fillStyle='#00bfff'; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
    } else if(t.isGlue) {
      ctx.fillStyle='#c8c800'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(5,-4,18,8);
    }
    ctx.restore();
    ctx.font='12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.icon,t.x,t.y);
    // upgrade dots (3 paths)
    const colors=['#f0e040','#e74c3c','#9b59b6'];
    for(let p=0;p<3;p++) {
      for(let l=0;l<t.upgrades[p];l++) {
        ctx.fillStyle=colors[p];
        ctx.beginPath(); ctx.arc(t.x-9+p*9,t.y+21,2.5,0,Math.PI*2); ctx.fill();
        // small dots per level
        ctx.fillStyle='rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(t.x-9+p*9+4,t.y+21,1.5,0,Math.PI*2); ctx.fill();
      }
    }
  }
}

function drawBloons() {
  for(const b of state.bloons) {
    if(b.dead) continue;
    const bt=BLOON_TYPES[b.type];
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(2,4,bt.size*0.8,bt.size*0.4,0,0,Math.PI*2); ctx.fill();
    if(b.frozenTimer>0) { ctx.fillStyle='#b0e8ff'; ctx.beginPath(); ctx.arc(0,0,bt.size+2,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle=bt.color; ctx.beginPath(); ctx.arc(0,0,bt.size,0,Math.PI*2); ctx.fill();
    if(b.gluedTimer>0) { ctx.fillStyle='rgba(200,200,0,0.4)'; ctx.beginPath(); ctx.arc(0,0,bt.size,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle=bt.border||'rgba(255,255,255,0.5)'; ctx.lineWidth=bt.borderW||1; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.32)'; ctx.beginPath(); ctx.arc(-bt.size*0.3,-bt.size*0.35,bt.size*0.32,0,Math.PI*2); ctx.fill();
    if(bt.hp>5) {
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-bt.size,-bt.size-6,bt.size*2,4);
      ctx.fillStyle=b.hp/bt.hp>0.5?'#27ae60':'#e74c3c';
      ctx.fillRect(-bt.size,-bt.size-6,bt.size*2*(b.hp/bt.hp),4);
    }
    ctx.restore();
  }
}

function drawProjectiles() {
  for(const p of state.projectiles) {
    ctx.fillStyle=p.color||'#fff';
    if(p.isLaser) {
      ctx.strokeStyle=p.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,p.size/2),0,Math.PI*2); ctx.fill();
    }
  }
}

function drawExplosions() {
  for(const e of state.explosions) {
    const t=e.life/e.maxLife; // 1→0 as explosion ages
    // outer shockwave ring
    ctx.globalAlpha=t*0.6;
    ctx.strokeStyle='#ff8800';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke();
    // inner glow fill
    const grad=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
    grad.addColorStop(0, `rgba(255,220,50,${t*0.55})`);
    grad.addColorStop(0.4, `rgba(255,100,0,${t*0.4})`);
    grad.addColorStop(1, `rgba(255,40,0,0)`);
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.lineWidth=1;
}

function drawParticles() {
  for(const p of state.particles) {
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw() {
  ctx.clearRect(0,0,700,520);
  drawScene();
  drawTowerPreview();
  drawTowers();
  drawBloons();
  drawExplosions();
  drawProjectiles();
  drawParticles();
  drawHUD();
}

// =====================================================================
// UI
// =====================================================================
function getTowerTotalSpent(tower) {
  let v = TOWER_DEFS.find(d=>d.id===tower.typeId).cost;
  const def = TOWER_DEFS.find(d=>d.id===tower.typeId);
  for(let path=0;path<3;path++) {
    for(let tier=0;tier<tower.upgrades[path];tier++) {
      v+=def.upgrades[path][tier].cost;
    }
  }
  return v;
}

function updateUI() {
  document.getElementById('stat-lives').textContent=Math.max(0,state.lives);
  document.getElementById('stat-money').textContent='$'+state.money;
  document.getElementById('stat-round').textContent=state.round+' / '+state.maxRound;
  document.getElementById('stat-popped').textContent=state.popped;

  document.querySelectorAll('.tower-btn').forEach(btn=>{
    const cost=parseInt(btn.dataset.cost);
    btn.classList.toggle('too-expensive', state.money<cost);
    btn.classList.toggle('selected', state.selectedTowerType && state.selectedTowerType.id===btn.dataset.id);
  });

  const panel=document.getElementById('upgrade-panel');
  if(!state.selectedTower) { panel.style.display='none'; return; }

  panel.style.display='block';
  const t=state.selectedTower;
  const def=TOWER_DEFS.find(d=>d.id===t.typeId);
  const pathLabels=[' Pfad 1',' Pfad 2',' Pfad 3'];
  const pathColors=['#f0e040','#e74c3c','#9b59b6'];

  document.getElementById('upgrade-title').textContent=`${t.name}  [${t.upgrades.join('-')}]`;

  const pathsDiv=document.getElementById('upgrade-paths');
  pathsDiv.innerHTML='';

  for(let path=0;path<3;path++) {
    const curLevel=t.upgrades[path];
    const pathDiv=document.createElement('div');
    pathDiv.className='upgrade-path';

    // Header with pips
    const header=document.createElement('div');
    header.className='path-header';
    const nameSpan=document.createElement('span');
    nameSpan.className='path-name';
    nameSpan.style.color=pathColors[path];
    nameSpan.textContent=pathLabels[path];
    header.appendChild(nameSpan);

    const pips=document.createElement('div');
    pips.className='path-pips';
    for(let i=0;i<5;i++) {
      const pip=document.createElement('div');
      pip.className='pip'+(i<curLevel?' filled'+(i>=4?' t5':i>=3?' t4':i>=2?' t3':''):'');
      pips.appendChild(pip);
    }
    header.appendChild(pips);
    pathDiv.appendChild(header);

    // Tier buttons
    for(let tier=0;tier<5;tier++) {
      const upgDef=def.upgrades[path][tier];
      const done=curLevel>tier;
      const isNext=curLevel===tier;
      const canAfford=state.money>=upgDef.cost;
      const canDo=canUpgradePath(t,path);

      const btn=document.createElement('button');
      const tierClass=tier>=4?'t5':tier>=3?'t4':tier>=2?'t3':'';
      btn.className='upgrade-tier-btn'+(done?' done':tierClass?' '+tierClass:'');
      btn.disabled=done||!isNext||!canDo||!canAfford;

      const costSpan=done?'✓':(!canDo&&isNext?'🔒':('$'+upgDef.cost));
      btn.innerHTML=`<span>${tier+1}. ${upgDef.name}</span><span class="tier-cost">${costSpan}</span>`;
      btn.title=upgDef.desc;

      if(isNext&&canDo&&canAfford) {
        btn.onclick=()=>{
          state.money-=upgDef.cost;
          applyUpgrade(t,path);
          updateUI();
        };
      }
      pathDiv.appendChild(btn);
    }
    pathsDiv.appendChild(pathDiv);
  }

  const sellVal=Math.round(getTowerTotalSpent(t)*0.7);
  document.getElementById('sell-btn').textContent=`Verkaufen ($${sellVal})`;
  document.getElementById('sell-btn').onclick=()=>{
    state.money+=sellVal;
    state.towers=state.towers.filter(tt=>tt!==t);
    state.selectedTower=null;
    updateUI();
  };
}

// =====================================================================
// TOWER BUTTONS
// =====================================================================
function buildTowerButtons() {
  const container=document.getElementById('tower-buttons');
  container.innerHTML='';
  TOWER_DEFS.forEach(def=>{
    const btn=document.createElement('button');
    btn.className='tower-btn';
    btn.dataset.id=def.id;
    btn.dataset.cost=def.cost;
    btn.innerHTML=`<div class="tower-icon" style="background:${def.color}">${def.icon}</div>
      <div class="tower-info"><div class="tower-name">${def.name}</div><div class="tower-cost">$${def.cost}</div></div>`;
    btn.onclick=()=>{
      if(state.money<def.cost) return;
      state.selectedTowerType = (state.selectedTowerType===def) ? null : def;
      state.selectedTower=null;
      updateUI();
    };
    container.appendChild(btn);
  });
}

// =====================================================================
// CANVAS EVENTS
// =====================================================================
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  state.hoveredPos={x:e.clientX-r.left, y:e.clientY-r.top};
});
canvas.addEventListener('mouseleave',()=>{ state.hoveredPos=null; });

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;

  if(state.selectedTowerType) {
    const def=state.selectedTowerType;
    if(state.money<def.cost) return;
    if(isOnPath(x,y)) return;
    if(state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25)) return;
    state.money-=def.cost;
    state.towers.push(createTower(def,x,y));
    state.selectedTowerType=null;
    updateUI();
    return;
  }

  // Select tower by clicking on it
  const found=state.towers.find(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<18);
  state.selectedTower = (found && state.selectedTower===found) ? null : (found||null);
  updateUI();
});

// =====================================================================
// BUTTONS
// =====================================================================
document.getElementById('start-btn').onclick=()=>{
  if(state.waveActive||state.gameOver||state.victory) return;
  state.waveActive=true;
  state.spawnQueue=makeWave(state.round);
  state.spawnTimer=0;
  document.getElementById('start-btn').disabled=true;
};

document.getElementById('speed-btn').onclick=()=>{
  state.speed=state.speed===1?2:1;
  document.getElementById('speed-btn').textContent=state.speed===2?'⏩ 1x Geschwindigkeit':'⏩ 2x Geschwindigkeit';
};

// =====================================================================
// GAME LOOP
// =====================================================================
function gameLoop() {
  for(let i=0;i<state.speed;i++) update();
  draw();
  requestAnimationFrame(gameLoop);
}

function endGame(win) {
  state.gameOver=!win; state.victory=win;
  const msg=document.getElementById('message');
  document.getElementById('msg-title').textContent=win?'🎉 GEWONNEN!':'💀 GAME OVER';
  document.getElementById('msg-sub').textContent=win
    ?`Alle ${state.maxRound} Runden überlebt! Gepoppt: ${state.popped}`
    :`Leben verloren in Runde ${state.round}. Gepoppt: ${state.popped}`;
  msg.style.display='block';
}

function restartGame() {
  document.getElementById('message').style.display='none';
  initState();
  document.getElementById('start-btn').disabled=false;
  updateUI();
}

// =====================================================================
// INIT
// =====================================================================
buildTowerButtons();
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
