<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloon Pop</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; font-family:Arial,sans-serif; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow:hidden; }

/* ===== MAP SELECT ===== */
#map-select {
  position:fixed; inset:0; background:#1a1a2e;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; z-index:200; overflow-y:auto; padding-bottom:20px;
}
#map-select h1 { font-size:2.2rem; color:#f0e040; text-shadow:0 0 20px #f0a000,2px 2px 0 #a06000; padding:18px 0 6px; letter-spacing:3px; }
#map-select p { color:#aaa; margin-bottom:18px; font-size:0.9rem; }
#map-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:14px; max-width:720px; width:100%; padding:0 16px;
}
.map-card {
  background:#16213e; border:2px solid #0f3460; border-radius:10px;
  cursor:pointer; transition:all 0.18s; overflow:hidden;
  display:flex; flex-direction:column;
}
.map-card:hover { border-color:#f0a000; box-shadow:0 0 14px #f0a00055; transform:translateY(-2px); }
.map-card canvas { display:block; width:100%; }
.map-card-info { padding:10px 12px; }
.map-card-name { font-size:0.95rem; font-weight:bold; color:#f0e040; }
.map-card-diff { font-size:0.75rem; color:#aaa; margin-top:2px; }
.diff-easy   { color:#27ae60; }
.diff-med    { color:#f39c12; }
.diff-hard   { color:#e74c3c; }
.diff-expert { color:#9b59b6; }

/* ===== GAME ===== */
#game-wrapper { display:none; flex-direction:column; align-items:center; }
#title { font-size:1.8rem; font-weight:bold; color:#f0e040; text-shadow:0 0 20px #f0a000,2px 2px 0 #a06000; padding:6px 0 2px; letter-spacing:3px; }
#game-area { display:flex; gap:10px; align-items:flex-start; padding:4px 10px; }
#canvas { border:3px solid #f0a000; border-radius:6px; cursor:crosshair; display:block; }
#sidebar { width:200px; display:flex; flex-direction:column; gap:6px; max-height:530px; overflow-y:auto; }
#sidebar::-webkit-scrollbar { width:4px; }
#sidebar::-webkit-scrollbar-thumb { background:#0f3460; border-radius:2px; }
#stats { background:#16213e; border:2px solid #0f3460; border-radius:8px; padding:8px 10px; font-size:0.82rem; }
.stat-row { display:flex; justify-content:space-between; margin-bottom:3px; }
.stat-label { color:#aaa; }
.stat-val { font-weight:bold; color:#f0e040; }
#towers-panel { background:#16213e; border:2px solid #0f3460; border-radius:8px; padding:8px; }
#towers-panel h3 { font-size:0.78rem; color:#aaa; margin-bottom:6px; text-align:center; text-transform:uppercase; letter-spacing:1px; }
.tower-btn { width:100%; margin-bottom:4px; padding:5px; border-radius:6px; border:2px solid transparent; cursor:pointer; font-size:0.75rem; font-weight:bold; transition:all 0.15s; display:flex; align-items:center; gap:6px; background:#0f3460; color:#fff; }
.tower-btn:hover { filter:brightness(1.2); }
.tower-btn.selected { border-color:#f0e040; box-shadow:0 0 8px #f0a000; }
.tower-btn.too-expensive { opacity:0.4; cursor:not-allowed; }
.tower-icon { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.tower-name { font-size:0.75rem; }
.tower-cost { font-size:0.68rem; color:#f0e040; }
#upgrade-panel { background:#16213e; border:2px solid #0f3460; border-radius:8px; padding:8px; display:none; }
#upgrade-panel h3 { font-size:0.78rem; color:#aaa; margin-bottom:6px; text-align:center; }
.upgrade-path { margin-bottom:7px; background:#0a1a30; border-radius:6px; padding:5px; }
.path-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; font-size:0.7rem; color:#aaa; }
.path-name { font-weight:bold; }
.path-pips { display:flex; gap:3px; }
.pip { width:9px; height:9px; border-radius:50%; background:#333; border:1px solid #555; }
.pip.filled    { background:#f0e040; border-color:#f0a000; box-shadow:0 0 3px #f0a000; }
.pip.filled.t3 { background:#e74c3c; border-color:#c00; }
.pip.filled.t4 { background:#9b59b6; border-color:#7d3c98; }
.pip.filled.t5 { background:#f39c12; border-color:#e67e22; box-shadow:0 0 5px #f39c12; }
.upgrade-tier-btn { width:100%; padding:4px 5px; border-radius:4px; border:none; cursor:pointer; font-size:0.66rem; font-weight:bold; background:#0f5460; color:#fff; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; transition:all 0.15s; }
.upgrade-tier-btn:hover:not(:disabled) { filter:brightness(1.25); }
.upgrade-tier-btn:disabled { opacity:0.35; cursor:not-allowed; }
.upgrade-tier-btn.done { background:#1a3a20; border-left:3px solid #27ae60; }
.upgrade-tier-btn.t3 { background:#3a1a0a; border-left:3px solid #e74c3c; }
.upgrade-tier-btn.t4 { background:#2a1040; border-left:3px solid #9b59b6; }
.upgrade-tier-btn.t5 { background:#3a2000; border-left:3px solid #f39c12; }
.tier-cost { color:#f0e040; font-size:0.63rem; }
#sell-btn { width:100%; padding:5px; border-radius:5px; border:none; cursor:pointer; font-size:0.73rem; font-weight:bold; background:#7a0000; color:#fff; margin-top:4px; }
#sell-btn:hover { filter:brightness(1.2); }
#action-btns { display:flex; flex-direction:column; gap:5px; }
#start-btn,#speed-btn { padding:8px; border-radius:8px; border:none; cursor:pointer; font-size:0.85rem; font-weight:bold; width:100%; transition:all 0.15s; }
#start-btn { background:#16a34a; color:#fff; }
#start-btn:hover:not(:disabled) { filter:brightness(1.15); }
#start-btn:disabled { background:#444; cursor:not-allowed; }
#speed-btn { background:#1d4ed8; color:#fff; }
#speed-btn:hover { filter:brightness(1.15); }
#back-btn { padding:6px; border-radius:6px; border:none; cursor:pointer; font-size:0.78rem; background:#2c3e50; color:#fff; width:100%; }
#back-btn:hover { filter:brightness(1.2); }
#bloon-legend { background:#16213e; border:2px solid #0f3460; border-radius:8px; padding:6px; font-size:0.68rem; }
#bloon-legend h3 { color:#aaa; margin-bottom:4px; text-align:center; font-size:0.7rem; text-transform:uppercase; }
.legend-row { display:flex; align-items:center; gap:5px; margin-bottom:2px; }
.legend-circle { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,0.3); }
#message { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.93); border:3px solid #f0a000; border-radius:16px; padding:28px 44px; text-align:center; display:none; z-index:300; }
#message h2 { font-size:1.9rem; margin-bottom:10px; }
#message p { color:#aaa; margin-bottom:18px; }
.msg-btns { display:flex; gap:10px; justify-content:center; }
.msg-btns button { padding:11px 24px; border-radius:8px; border:none; cursor:pointer; font-size:0.95rem; font-weight:bold; }
#msg-restart { background:#16a34a; color:#fff; }
#msg-menu    { background:#2c3e50; color:#fff; }
</style>
</head>
<body>

<!-- MAP SELECT -->
<div id="map-select">
  <h1>🎈 BLOON POP 🎈</h1>
  <p>Wähle deine Karte</p>
  <div id="map-grid"></div>
</div>

<!-- GAME -->
<div id="game-wrapper">
  <div id="title">🎈 BLOON POP 🎈</div>
  <div id="game-area">
    <canvas id="canvas" width="700" height="520"></canvas>
    <div id="sidebar">
      <div id="stats">

        <div class="stat-row"><span class="stat-label">💥 Gepoppt</span><span class="stat-val" id="stat-popped">0</span></div>
      </div>
      <div id="towers-panel">
        <h3>Türme platzieren</h3>
        <div id="tower-buttons"></div>
      </div>
      <div id="upgrade-panel">
        <h3 id="upgrade-title">Turm</h3>
        <div id="upgrade-paths"></div>
        <button id="sell-btn">Verkaufen</button>
      </div>
      <div id="action-btns">
        <button id="start-btn">▶ Runde starten</button>
        <button id="speed-btn">⏩ 2x Geschwindigkeit</button>
        <button id="back-btn">🗺 Karte wechseln</button>
      </div>
      <div id="bloon-legend">
        <h3>Bloons</h3>
        <div class="legend-row"><div class="legend-circle" style="background:#e74c3c"></div><span>Rot (1 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#3498db"></div><span>Blau (2 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#27ae60"></div><span>Grün (3 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#f39c12"></div><span>Gelb (4 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#ff69b4"></div><span>Pink (5 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#888"></div><span>Schwarz (6 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#8B4513"></div><span>Keramik (10 HP)</span></div>
        <div class="legend-row"><div class="legend-circle" style="background:#d4af37;border:2px solid #8B0000"></div><span>MOAB (50 HP)</span></div>
      </div>
    </div>
  </div>
</div>

<div id="message">
  <h2 id="msg-title"></h2>
  <p id="msg-sub"></p>
  <div class="msg-btns">
    <button id="msg-restart" onclick="restartGame()">Nochmal</button>
    <button id="msg-menu"    onclick="goToMenu()">Karte wählen</button>
  </div>
</div>

// =====================================================================
// WAVES
// =====================================================================
function makeWave(round) {
  const bloons=[];
  const r=round;
  function add(type,count,interval=20,offset=0){
    for(let i=0;i<count;i++) bloons.push({type,delay:offset+i*interval});
  }
  if(r<=2)       {add('red',8+r*4);}
  else if(r<=4)  {add('red',10+r*3);add('blue',r*3,25,20);}
  else if(r<=7)  {add('blue',r*5,20);add('green',r*2,30,30);}
  else if(r<=10) {add('green',r*3,22);add('yellow',r*2,32,40);}
  else if(r<=13) {add('yellow',r*3,20);add('pink',r*2,28,50);}
  else if(r<=16) {add('pink',r*3,18);add('black',r,35);}
  else if(r<=20) {add('black',r*2,20);add('pink',r,25,10);}
  else if(r<=23) {add('ceramic',Math.floor(r*1.5),28);add('black',r,22,20);}
  else if(r<=26) {add('ceramic',r*2,20);add('moab',Math.floor(r/6),90);}
  else if(r<=29) {add('ceramic',r,22);add('moab',Math.floor(r/4),80);add('black',r/2|0,25,10);}
  else           {add('moab',6,70);add('ceramic',25,14);add('pink',20,12,10);}
  bloons.sort((a,b)=>a.delay-b.delay);
  return bloons;
}

// =====================================================================
// PATH HELPERS
// =====================================================================
function getPath() { return currentMap.path; }

function posOnPath(dist) {
  const PATH=getPath();
  let rem=dist;
  for(let i=1;i<PATH.length;i++){
    const dx=PATH[i].x-PATH[i-1].x, dy=PATH[i].y-PATH[i-1].y;
    const seg=Math.sqrt(dx*dx+dy*dy);
    if(rem<=seg){const t=rem/seg;return{x:PATH[i-1].x+dx*t,y:PATH[i-1].y+dy*t,done:false};}
    rem-=seg;
  }
  return{x:PATH[PATH.length-1].x,y:PATH[PATH.length-1].y,done:true};
}

function isOnPath(x,y,margin=20) {
  const PATH=getPath();
  for(let i=1;i<PATH.length;i++){
    const ax=PATH[i-1].x,ay=PATH[i-1].y,bx=PATH[i].x,by=PATH[i].y;
    const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/len2));
    const px=ax+t*dx,py=ay+t*dy;
    if(Math.sqrt((x-px)**2+(y-py)**2)<margin) return true;
  }
  return false;
}

// =====================================================================
// UPGRADE SYSTEM
// =====================================================================
function canUpgradePath(tower,path) {
  const levels=tower.upgrades;
  if(levels[path]>=5) return false;
  const next=levels[path]+1;
  const nonZero=levels.filter(l=>l>0).length;
  if(levels[path]===0&&nonZero>=2) return false;
  if(next>=3&&levels.some((l,i)=>i!==path&&l>=3)) return false;
  if(levels.some((l,i)=>i!==path&&l>=3)&&next>2) return false;
  return true;
}

function applyUpgrade(tower,path) {
  const def=TOWER_DEFS.find(d=>d.id===tower.typeId);
  const level=tower.upgrades[path];
  def.upgrades[path][level].apply(tower);
  tower.upgrades[path]++;
}

function upgradeCost(tower,path) {
  const def=TOWER_DEFS.find(d=>d.id===tower.typeId);
  const level=tower.upgrades[path];
  if(level>=5) return Infinity;
  return def.upgrades[path][level].cost;
}

let bloonId=0;
function spawnBloon(type) {
  const bt=BLOON_TYPES[type];
  const p0=getPath()[0];
  return{id:bloonId++,type,hp:bt.hp,maxHp:bt.hp,speed:bt.speed,dist:0,x:p0.x,y:p0.y,frozenTimer:0,gluedTimer:0,slowFactor:1,glueDot:false,glueDotDmg:1};
}

let towerUid=0;
function createTower(def,x,y) {
  return{...def, uid:towerUid++, typeId:def.id, x, y, angle:0, cooldown:0, upgrades:[0,0,0], moneyPerShot:0, supplyDrop:false, supplyAmt:200};
}

// =====================================================================
// PROJECTILE
// =====================================================================
let projId=0;
function createProjectile(tower,dx,dy,targetId) {
  return{
    id:projId++, x:tower.x, y:tower.y, dx, dy,
    speed:tower.projectileSpeed, damage:tower.damage, pierce:tower.pierce,
    hit:new Set(), towerRef:tower, targetId:targetId||null,
    isExplosive:tower.isExplosive||false, onHitExplode:tower.onHitExplode||false,
    blastRadius:tower.blastRadius||0, isGlue:tower.isGlue||false,
    slowFactor:tower.slowFactor||1, slowDuration:tower.slowDuration||0,
    glueDot:tower.glueDot||false, glueDotDmg:tower.glueDotDmg||1,
    moabMauler:tower.moabMauler||false, moabElim:tower.moabElim||false,
    moabMulti:tower.moabMulti||1,
    color:tower.projectileColor, size:tower.projectileSize,
    isFlash:tower.flashBomb||false, flashR:tower.flashBombR||0, flashDmg:tower.flashBombDmg||0,
    ninjaFreeze:tower.ninjaFreeze||false, ninjaFreezeTime:tower.ninjaFreezeTime||0,
    morterFreeze:tower.morterFreeze||false, morterFreezeTime:tower.morterFreezeTime||0,
    isMortar:tower.isMortar||false,
  };
}

// =====================================================================
// PARTICLES / EXPLOSIONS
// =====================================================================
function burst(x,y,color,count=8) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,maxLife:50,color,size:2+Math.random()*3});
  }
}

// =====================================================================
// DAMAGE
// =====================================================================
function takeDamage(bloon,dmg) {
  if(!bloon||bloon.dead) return;
  bloon.hp-=dmg;
  if(bloon.hp<=0) killBloon(bloon);
}

function killBloon(bloon) {
  const bt=BLOON_TYPES[bloon.type];
  state.money+=bt.reward; state.popped++;
  burst(bloon.x,bloon.y,bt.color,bloon.type==='moab'?20:8);
  bloon.dead=true;
  if(bloon.type==='moab'){
    for(let i=0;i<4;i++){
      const b=spawnBloon('ceramic'); b.dist=bloon.dist;
      const p=posOnPath(b.dist); b.x=p.x; b.y=p.y;
      state.bloons.push(b);
    }
  }
  updateUI();
}

// =====================================================================
// TOWER AI
// =====================================================================
function findTarget(tower) {
  let best=null,bestDist=-1;
  for(const b of state.bloons){
    if(b.dead) continue;
    if(b.frozenTimer>0&&!tower.isExplosive&&!tower.isMortar) continue;
    const dx=b.x-tower.x,dy=b.y-tower.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<=tower.range&&b.dist>bestDist){bestDist=b.dist;best=b;}
  }
  return best;
}

function shootTower(tower) {
  if(tower.cooldown>0){tower.cooldown--;return;}

  if(tower.isFreeze){
    let any=false;
    for(const b of state.bloons){
      if(b.dead) continue;
      const dx=b.x-tower.x,dy=b.y-tower.y;
      if(Math.sqrt(dx*dx+dy*dy)<=tower.range){
        any=true;
        if(b.type!=='moab') b.frozenTimer=Math.round(tower.freezeDuration);
        if(tower.damage>0) takeDamage(b,tower.damage);
      }
    }
    if(any){tower.cooldown=tower.fireRate;burst(tower.x,tower.y,'#00bfff',4);}
    return;
  }

  const target=findTarget(tower);
  if(!target) return;
  tower.cooldown=tower.fireRate;
  if(tower.moneyPerShot) state.money+=tower.moneyPerShot;

  const dx=target.x-tower.x,dy=target.y-tower.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  tower.angle=Math.atan2(dy,dx);

  const shoot=(ddx,ddy)=>state.projectiles.push(createProjectile(tower,ddx,ddy,target.id));

  if(tower.spreadShot){
    const n=tower.spreadShot;
    for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2;shoot(Math.cos(a),Math.sin(a));}
  } else if(tower.spreadTriple){
    for(let i=-1;i<=1;i++){const a=Math.atan2(dy,dx)+i*0.2;shoot(Math.cos(a),Math.sin(a));}
  } else if(tower.dualShot){
    shoot(dx/len,dy/len);
    const a=Math.atan2(dy,dx)+0.25;
    shoot(Math.cos(a),Math.sin(a));
  } else {
    shoot(dx/len,dy/len);
  }
}

// =====================================================================
// PROJECTILE LOGIC
// =====================================================================
function explodeAt(proj,x,y) {
  for(const b of state.bloons){
    if(b.dead||proj.hit.has(b.id)) continue;
    const dx=b.x-x,dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<=proj.blastRadius){
      let dmg=proj.damage;
      if(proj.moabMauler&&b.type==='moab') dmg*=(proj.moabMulti||10);
      if(proj.moabElim&&b.type==='moab') dmg*=20;
      takeDamage(b,dmg);
      proj.hit.add(b.id);
      if(proj.ninjaFreeze&&b.type!=='moab') b.frozenTimer=proj.ninjaFreezeTime;
      if(proj.morterFreeze&&b.type!=='moab') b.frozenTimer=proj.morterFreezeTime;
    }
  }
  state.explosions.push({x,y,r:4,maxR:proj.blastRadius,life:18,maxLife:18});
  burst(x,y,'#ff6600',12); burst(x,y,'#ffcc00',8);
}

function updateProjectile(proj) {
  if(proj.dead) return;
  proj.x+=proj.dx*proj.speed; proj.y+=proj.dy*proj.speed;
  if(proj.x<-60||proj.x>760||proj.y<-60||proj.y>580){proj.dead=true;return;}

  if(proj.isExplosive&&!proj.onHitExplode){
    for(const b of state.bloons){
      if(b.dead) continue;
      const bt=BLOON_TYPES[b.type];
      const dx=b.x-proj.x,dy=b.y-proj.y;
      if(Math.sqrt(dx*dx+dy*dy)<bt.size+proj.size){
        explodeAt(proj,proj.x,proj.y); proj.dead=true; return;
      }
    }
    const target=state.bloons.find(b=>!b.dead&&b.id===proj.targetId);
    if(!target){explodeAt(proj,proj.x,proj.y);proj.dead=true;}
    return;
  }

  for(const b of state.bloons){
    if(b.dead||proj.hit.has(b.id)) continue;
    const bt=BLOON_TYPES[b.type];
    const dx=b.x-proj.x,dy=b.y-proj.y;
    if(Math.sqrt(dx*dx+dy*dy)<=bt.size+proj.size/2){
      proj.hit.add(b.id);
      if(proj.isGlue){
        b.gluedTimer=proj.slowDuration; b.slowFactor=proj.slowFactor;
        if(proj.glueDot){b.glueDot=true;b.glueDotDmg=proj.glueDotDmg;}
        if(proj.damage>0) takeDamage(b,proj.damage);
      } else if(proj.onHitExplode){
        let dmg=proj.damage;
        if(proj.moabMauler&&b.type==='moab') dmg*=(proj.moabMulti||10);
        takeDamage(b,dmg);
        explodeAt(proj,proj.x,proj.y);
      } else {
        let dmg=proj.damage;
        if(proj.moabMauler&&b.type==='moab') dmg*=(proj.moabMulti||10);
        if(proj.moabElim&&b.type==='moab') dmg*=20;
        takeDamage(b,dmg);
        if(proj.ninjaFreeze&&b.type!=='moab') b.frozenTimer=proj.ninjaFreezeTime;
      }
      proj.pierce--;
      if(proj.pierce<=0){proj.dead=true;return;}
    }
  }
}

// =====================================================================
// UPDATE
// =====================================================================
function update() {
  if(state.gameOver||state.victory) return;
  state.frame++;

  if(state.waveActive&&state.spawnQueue.length>0){
    state.spawnTimer++;
    while(state.spawnQueue.length>0&&state.spawnQueue[0].delay<=state.spawnTimer)
      state.bloons.push(spawnBloon(state.spawnQueue.shift().type));
  }

  for(const b of state.bloons){
    if(b.dead) continue;
    if(b.frozenTimer>0){b.frozenTimer--;continue;}
    if(b.gluedTimer>0) b.gluedTimer--;
    else b.slowFactor=1;
    if(b.glueDot&&b.gluedTimer>0&&state.frame%60===0) takeDamage(b,b.glueDotDmg||1);
    const spd=b.speed*(b.gluedTimer>0?b.slowFactor:1);
    b.dist+=spd;
    const p=posOnPath(b.dist); b.x=p.x; b.y=p.y;
    if(p.done){
      state.lives-=BLOON_TYPES[b.type].hp;
      burst(b.x,b.y,'#ff0000',5); b.dead=true;
      if(state.lives<=0){state.lives=0;endGame(false);return;}
      updateUI();
    }
  }
  state.bloons=state.bloons.filter(b=>!b.dead);

  for(const t of state.towers) shootTower(t);

  for(const p of state.projectiles) updateProjectile(p);
  state.projectiles=state.projectiles.filter(p=>!p.dead);

  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.9;p.vy*=0.9;p.life--;}
  state.particles=state.particles.filter(p=>p.life>0);

  for(const e of state.explosions){e.r=e.maxR*(1-e.life/e.maxLife);e.life--;}
  state.explosions=state.explosions.filter(e=>e.life>0);

  if(state.waveActive&&state.spawnQueue.length===0&&state.bloons.length===0){
    state.waveActive=false;
    if(state.round>=state.maxRound){endGame(true);return;}
    for(const t of state.towers) if(t.supplyDrop) state.money+=t.supplyAmt||200;
    state.round++;
    state.money+=100+state.round*10;
    updateUI();
    document.getElementById('start-btn').disabled=false;
  }
}

// =====================================================================
// DRAW HELPERS
// =====================================================================
function drawPathOnCtx(context, path, grassColor, w, h, scaleX, scaleY, offsetX, offsetY) {
  context.fillStyle=grassColor;
  context.fillRect(0,0,w,h);
  // outer
  context.strokeStyle='#b8944e'; context.lineWidth=Math.max(3,14*Math.min(scaleX,scaleY));
  context.lineCap='round'; context.lineJoin='round';
  context.beginPath(); context.moveTo(path[0].x*scaleX+offsetX, path[0].y*scaleY+offsetY);
  for(let i=1;i<path.length;i++) context.lineTo(path[i].x*scaleX+offsetX, path[i].y*scaleY+offsetY);
  context.stroke();
  // inner
  context.strokeStyle='#c8a46e'; context.lineWidth=Math.max(2,10*Math.min(scaleX,scaleY));
  context.beginPath(); context.moveTo(path[0].x*scaleX+offsetX, path[0].y*scaleY+offsetY);
  for(let i=1;i<path.length;i++) context.lineTo(path[i].x*scaleX+offsetX, path[i].y*scaleY+offsetY);
  context.stroke();
}

function drawScene() {
  const PATH=getPath();
  drawPathOnCtx(ctx, PATH, currentMap.grassColor, 700, 520, 1, 1, 0, 0);
  // dashed guide
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
  ctx.setLineDash([12,8]);
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke(); ctx.setLineDash([]);
  // markers
  ctx.fillStyle='#27ae60'; ctx.beginPath(); ctx.arc(PATH[0].x,PATH[0].y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 8px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('IN',PATH[0].x,PATH[0].y);
  ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(PATH[PATH.length-1].x,PATH[PATH.length-1].y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText('OUT',PATH[PATH.length-1].x,PATH[PATH.length-1].y);
}

function drawTowerPreview() {
  if(!state.selectedTowerType||!state.hoveredPos) return;
  const{x,y}=state.hoveredPos;
  const tt=state.selectedTowerType;
  const occupied=state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25);
  const valid=!isOnPath(x,y)&&!occupied;
  ctx.beginPath(); ctx.arc(x,y,tt.range,0,Math.PI*2);
  ctx.fillStyle=valid?'rgba(255,255,255,0.06)':'rgba(255,0,0,0.06)'; ctx.fill();
  ctx.strokeStyle=valid?'rgba(255,255,255,0.3)':'rgba(255,0,0,0.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.globalAlpha=valid?0.7:0.3;
  ctx.fillStyle=tt.color; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

function drawTowers() {
  for(const t of state.towers){
    if(state.selectedTower===t){
      ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
    }
    ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
    ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=state.selectedTower===t?'#f0e040':'rgba(255,255,255,0.35)';
    ctx.lineWidth=state.selectedTower===t?3:1.5; ctx.stroke();
    if(t.isFreeze){ctx.fillStyle='#00bfff';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();}
    else if(t.isGlue){ctx.fillStyle='#c8c800';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(5,-4,18,8);}
    ctx.restore();
    ctx.font='12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.icon,t.x,t.y);
    // upgrade dots
    const colors=['#f0e040','#e74c3c','#9b59b6'];
    for(let p=0;p<3;p++) for(let l=0;l<t.upgrades[p];l++){
      ctx.fillStyle=colors[p];
      ctx.beginPath(); ctx.arc(t.x-9+p*9,t.y+21,2.5,0,Math.PI*2); ctx.fill();
    }
  }
}

function drawBloons() {
  for(const b of state.bloons){
    if(b.dead) continue;
    const bt=BLOON_TYPES[b.type];
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(2,4,bt.size*0.8,bt.size*0.4,0,0,Math.PI*2); ctx.fill();
    if(b.frozenTimer>0){ctx.fillStyle='#b0e8ff';ctx.beginPath();ctx.arc(0,0,bt.size+2,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=bt.color; ctx.beginPath(); ctx.arc(0,0,bt.size,0,Math.PI*2); ctx.fill();
    if(b.gluedTimer>0){ctx.fillStyle='rgba(200,200,0,0.4)';ctx.beginPath();ctx.arc(0,0,bt.size,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle=bt.border||'rgba(255,255,255,0.5)'; ctx.lineWidth=bt.borderW||1; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.32)'; ctx.beginPath(); ctx.arc(-bt.size*0.3,-bt.size*0.35,bt.size*0.32,0,Math.PI*2); ctx.fill();
    if(bt.hp>5){
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-bt.size,-bt.size-6,bt.size*2,4);
      ctx.fillStyle=b.hp/bt.hp>0.5?'#27ae60':'#e74c3c';
      ctx.fillRect(-bt.size,-bt.size-6,bt.size*2*(b.hp/bt.hp),4);
    }
    ctx.restore();
  }
}

function drawProjectiles() {
  for(const p of state.projectiles){
    ctx.fillStyle=p.color||'#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1.5,p.size/2),0,Math.PI*2); ctx.fill();
  }
}

function drawExplosions() {
  for(const e of state.explosions){
    const t=e.life/e.maxLife;
    ctx.globalAlpha=t*0.6; ctx.strokeStyle='#ff8800'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke();
    const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);
    g.addColorStop(0,`rgba(255,220,50,${t*0.55})`);
    g.addColorStop(0.4,`rgba(255,100,0,${t*0.4})`);
    g.addColorStop(1,'rgba(255,40,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.lineWidth=1;
}

function drawParticles() {
  for(const p of state.particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawHUD() {
  const pad=10,h=32;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(pad,pad,220,h,6); ctx.fill();
  ctx.textBaseline='middle'; const cy=pad+h/2;
  ctx.font='16px Arial'; ctx.textAlign='left'; ctx.fillText('❤️',pad+8,cy);
  ctx.font='bold 15px Arial'; ctx.fillStyle='#ff6b6b'; ctx.fillText(Math.max(0,state.lives),pad+30,cy);
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(pad+88,pad+6,1,h-12);
  ctx.font='16px Arial'; ctx.fillStyle='#fff'; ctx.fillText('🪙',pad+98,cy);
  ctx.font='bold 15px Arial'; ctx.fillStyle='#f0e040'; ctx.fillText('$'+state.money,pad+120,cy);
}

function draw() {
  ctx.clearRect(0,0,700,520);
  drawScene();
  drawTowerPreview();
  drawExplosions();
  drawTowers();
  drawBloons();
  drawProjectiles();
  drawParticles();
  drawHUD();
}

// =====================================================================
// UI
// =====================================================================
function getTowerTotalSpent(tower) {
  let v=TOWER_DEFS.find(d=>d.id===tower.typeId).cost;
  const def=TOWER_DEFS.find(d=>d.id===tower.typeId);
  for(let p=0;p<3;p++) for(let tier=0;tier<tower.upgrades[p];tier++) v+=def.upgrades[p][tier].cost;
  return v;
}

function updateUI() {
  document.getElementById('stat-lives')&&(document.getElementById('stat-lives').textContent=Math.max(0,state.lives));
  document.getElementById('stat-money')&&(document.getElementById('stat-money').textContent='$'+state.money);
  document.getElementById('stat-round').textContent=state.round+'/'+state.maxRound;
  document.getElementById('stat-popped').textContent=state.popped;

  document.querySelectorAll('.tower-btn').forEach(btn=>{
    btn.classList.toggle('too-expensive',state.money<parseInt(btn.dataset.cost));
    btn.classList.toggle('selected',state.selectedTowerType&&state.selectedTowerType.id===btn.dataset.id);
  });

  const panel=document.getElementById('upgrade-panel');
  if(!state.selectedTower){panel.style.display='none';return;}
  panel.style.display='block';
  const t=state.selectedTower;
  const def=TOWER_DEFS.find(d=>d.id===t.typeId);
  document.getElementById('upgrade-title').textContent=`${t.name} [${t.upgrades.join('-')}]`;
  const pathsDiv=document.getElementById('upgrade-paths');
  pathsDiv.innerHTML='';
  const pathColors=['#f0e040','#e74c3c','#9b59b6'];
  for(let path=0;path<3;path++){
    const curLevel=t.upgrades[path];
    const div=document.createElement('div'); div.className='upgrade-path';
    const header=document.createElement('div'); header.className='path-header';
    const nameSpan=document.createElement('span'); nameSpan.className='path-name';
    nameSpan.style.color=pathColors[path]; nameSpan.textContent='Pfad '+(path+1);
    header.appendChild(nameSpan);
    const pips=document.createElement('div'); pips.className='path-pips';
    for(let i=0;i<5;i++){const pip=document.createElement('div');pip.className='pip'+(i<curLevel?' filled'+(i>=4?' t5':i>=3?' t4':i>=2?' t3':''):'');pips.appendChild(pip);}
    header.appendChild(pips); div.appendChild(header);
    for(let tier=0;tier<5;tier++){
      const u=def.upgrades[path][tier];
      const done=curLevel>tier, isNext=curLevel===tier;
      const canDo=canUpgradePath(t,path), canAfford=state.money>=u.cost;
      const tc=tier>=4?'t5':tier>=3?'t4':tier>=2?'t3':'';
      const btn=document.createElement('button');
      btn.className='upgrade-tier-btn'+(done?' done':tc?' '+tc:'');
      btn.disabled=done||!isNext||!canDo||!canAfford;
      btn.innerHTML=`<span>${tier+1}. ${u.name}</span><span class="tier-cost">${done?'✓':(!canDo&&isNext?'🔒':'$'+u.cost)}</span>`;
      btn.title=u.desc;
      if(isNext&&canDo&&canAfford) btn.onclick=()=>{state.money-=u.cost;applyUpgrade(t,path);updateUI();};
      div.appendChild(btn);
    }
    pathsDiv.appendChild(div);
  }
  const sellVal=Math.round(getTowerTotalSpent(t)*0.7);
  document.getElementById('sell-btn').textContent=`Verkaufen ($${sellVal})`;
  document.getElementById('sell-btn').onclick=()=>{
    state.money+=sellVal;
    state.towers=state.towers.filter(tt=>tt!==t);
    state.selectedTower=null; updateUI();
  };
}

function buildTowerButtons() {
  const container=document.getElementById('tower-buttons');
  container.innerHTML='';
  TOWER_DEFS.forEach(def=>{
    const btn=document.createElement('button');
    btn.className='tower-btn'; btn.dataset.id=def.id; btn.dataset.cost=def.cost;
    btn.innerHTML=`<div class="tower-icon" style="background:${def.color}">${def.icon}</div>
      <div class="tower-info"><div class="tower-name">${def.name}</div><div class="tower-cost">$${def.cost}</div></div>`;
    btn.onclick=()=>{
      if(state.money<def.cost) return;
      state.selectedTowerType=(state.selectedTowerType===def)?null:def;
      state.selectedTower=null; updateUI();
    };
    container.appendChild(btn);
  });
}

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  state.hoveredPos={x:e.clientX-r.left,y:e.clientY-r.top};
});
canvas.addEventListener('mouseleave',()=>{state.hoveredPos=null;});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(state.selectedTowerType){
    const def=state.selectedTowerType;
    if(state.money<def.cost) return;
    if(isOnPath(x,y)) return;
    if(state.towers.some(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<25)) return;
    state.money-=def.cost;
    state.towers.push(createTower(def,x,y));
    state.selectedTowerType=null; updateUI(); return;
  }
  const found=state.towers.find(t=>Math.sqrt((t.x-x)**2+(t.y-y)**2)<18);
  state.selectedTower=(found&&state.selectedTower===found)?null:(found||null);
  updateUI();
});

document.getElementById('start-btn').onclick=()=>{
  if(state.waveActive||state.gameOver||state.victory) return;
  state.waveActive=true; state.spawnQueue=makeWave(state.round); state.spawnTimer=0;
  document.getElementById('start-btn').disabled=true;
};
document.getElementById('speed-btn').onclick=()=>{
  state.speed=state.speed===1?2:1;
  document.getElementById('speed-btn').textContent=state.speed===2?'⏩ 1x Geschwindigkeit':'⏩ 2x Geschwindigkeit';
};
document.getElementById('back-btn').onclick=()=>goToMenu();
document.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('start-btn').click();});

// =====================================================================
// GAME LOOP
// =====================================================================
function gameLoop() {
  for(let i=0;i<state.speed;i++) update();
  draw();
  requestAnimationFrame(gameLoop);
}

function endGame(win) {
  state.gameOver=!win; state.victory=win;
  const msg=document.getElementById('message');
  document.getElementById('msg-title').textContent=win?'🎉 GEWONNEN!':'💀 GAME OVER';
  document.getElementById('msg-sub').textContent=win
    ?`Alle ${state.maxRound} Runden überlebt! Gepoppt: ${state.popped}`
    :`Runde ${state.round} – Gepoppt: ${state.popped}`;
  msg.style.display='block';
}

function restartGame() {
  document.getElementById('message').style.display='none';
  initState(currentMap);
  document.getElementById('start-btn').disabled=false;
  buildTowerButtons(); updateUI();
}

function goToMenu() {
  document.getElementById('message').style.display='none';
  document.getElementById('game-wrapper').style.display='none';
  document.getElementById('map-select').style.display='flex';
}

function startGame(mapDef) {
  document.getElementById('map-select').style.display='none';
  document.getElementById('game-wrapper').style.display='flex';
  initState(mapDef);
  buildTowerButtons(); updateUI();
}

// =====================================================================
// MAP SELECT SCREEN
// =====================================================================
function buildMapSelect() {
  const grid=document.getElementById('map-grid');
  grid.innerHTML='';
  MAP_DEFS.forEach(mapDef=>{
    const card=document.createElement('div');
    card.className='map-card';

    // Mini canvas preview
    const previewCanvas=document.createElement('canvas');
    previewCanvas.width=220; previewCanvas.height=140;
    previewCanvas.style.width='100%';
    previewCanvas.style.height='auto';
    const pCtx=previewCanvas.getContext('2d');

    // Scale path to fit preview (700×520 → 220×140 with padding)
    const pw=220,ph=140,pad=12;
    const sx=(pw-pad*2)/700, sy=(ph-pad*2)/520;
    drawPathOnCtx(pCtx, mapDef.path, mapDef.grassColor, pw, ph, sx, sy, pad, pad);

    // Dashed guide on preview
    pCtx.strokeStyle='rgba(255,255,255,0.2)'; pCtx.lineWidth=1;
    pCtx.setLineDash([5,4]);
    pCtx.beginPath();
    pCtx.moveTo(mapDef.path[0].x*sx+pad, mapDef.path[0].y*sy+pad);
    for(let i=1;i<mapDef.path.length;i++) pCtx.lineTo(mapDef.path[i].x*sx+pad, mapDef.path[i].y*sy+pad);
    pCtx.stroke(); pCtx.setLineDash([]);

    // Start/end dots
    const p0=mapDef.path[0], pE=mapDef.path[mapDef.path.length-1];
    pCtx.fillStyle='#27ae60'; pCtx.beginPath(); pCtx.arc(p0.x*sx+pad,p0.y*sy+pad,5,0,Math.PI*2); pCtx.fill();
    pCtx.fillStyle='#e74c3c'; pCtx.beginPath(); pCtx.arc(pE.x*sx+pad,pE.y*sy+pad,5,0,Math.PI*2); pCtx.fill();

    card.appendChild(previewCanvas);

    const info=document.createElement('div'); info.className='map-card-info';
    info.innerHTML=`<div class="map-card-name">${mapDef.name}</div>
      <div class="map-card-diff ${mapDef.diffClass}">★ ${mapDef.difficulty}</div>`;
    card.appendChild(info);

    card.onclick=()=>startGame(mapDef);
    grid.appendChild(card);
  });
}

// =====================================================================
// INIT
// =====================================================================
buildMapSelect();
requestAnimationFrame(gameLoop);
</script>
</body>
